<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Amni-Connect</title>
<meta name="theme-color" content="#08090B">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Source+Serif+4:opsz,wght@8..60,300..700&display=swap" rel="stylesheet">
<style>
:root{--bg:#08090B;--bg2:#0D0F12;--panel:#111418;--panel2:#161A20;--border:#20242B;--border2:#2E343D;--text:#EDEFF2;--soft:#A7ADB6;--dim:#6D747D;--accent:#34D399;--accent-dim:rgba(52,211,153,.11);--ink:#04130D;--brass:#C89B4E;--danger:#FF6B6B;--hair:rgba(255,255,255,.08);--sans:"Archivo",system-ui,-apple-system,sans-serif;--serif:"Source Serif 4",Georgia,serif;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#F3F2EF;--bg2:#EAE9E4;--panel:#FFF;--panel2:#F8F7F4;--border:#E0DED8;--border2:#CBC7BE;--text:#101216;--soft:#454A52;--dim:#767B84;--accent:#047857;--accent-dim:rgba(4,120,87,.09);--ink:#FFF;--brass:#8A6318;--danger:#C0392B;--hair:rgba(0,0,0,.06);color-scheme:light}}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg) radial-gradient(1100px 480px at 50% -240px,var(--accent-dim),transparent 70%) no-repeat;color:var(--text);font:16px/1.55 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 clamp(16px,4vw,36px);background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--hair)}
.logo{font-weight:700;font-stretch:80%;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--text);text-decoration:none}.logo span{color:var(--dim);font-weight:500}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--soft)}
main{max-width:980px;margin:0 auto;padding:28px 16px 64px}
.eyebrow{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;font-stretch:80%;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}.eyebrow::before{content:'';width:26px;height:1px;background:currentColor}
h1{font-size:clamp(34px,7vw,58px);font-weight:800;font-stretch:112%;line-height:.96;text-transform:uppercase;letter-spacing:-.005em}
h2{font-size:15px;font-weight:700;font-stretch:82%;letter-spacing:.14em;text-transform:uppercase;display:flex;align-items:center;gap:10px;margin:34px 0 14px}h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--border2),transparent)}
.lede{font:19px/1.5 var(--serif);color:var(--soft);max-width:44ch;margin-top:14px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:18px;position:relative}.card::after{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--hair),transparent)}
.grid{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.dev{display:flex;flex-direction:column;gap:12px}.dev .top{display:flex;align-items:center;gap:12px}
.ico{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;background:var(--panel2);border:1px solid var(--border2);font:700 11px var(--sans);font-stretch:80%;letter-spacing:.12em;color:var(--soft);flex:none}
.nm{font-weight:700;font-size:17px;letter-spacing:.01em}.meta{font-size:12.5px;color:var(--dim);display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}.dot.on{background:var(--accent);box-shadow:0 0 0 3px var(--accent-dim)}
.chip{font-size:10px;font-weight:650;font-stretch:80%;letter-spacing:.16em;text-transform:uppercase;padding:3px 8px;border:1px solid var(--border2);border-radius:2px;color:var(--soft)}.chip.o{color:var(--brass);border-color:color-mix(in srgb,var(--brass) 55%,transparent)}.chip.g{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 55%,transparent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:700 12px/1 var(--sans);font-stretch:80%;letter-spacing:.17em;text-transform:uppercase;padding:13px 18px;border-radius:2px;border:1px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;position:relative;overflow:hidden;isolation:isolate;transition:color .18s,border-color .18s}
.btn::before{content:'';position:absolute;inset:0;z-index:-1;background:var(--text);transform:scaleX(0);transform-origin:left;transition:transform .34s cubic-bezier(.16,1,.3,1)}.btn:hover::before{transform:scaleX(1)}.btn:hover{color:var(--bg);border-color:var(--text)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--ink)}.btn.d{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,transparent)}.btn.s{padding:9px 12px;font-size:11px}.btn.w{width:100%}.btn:disabled{background:transparent;border-color:var(--border);color:var(--dim);pointer-events:none}
label{display:block;font-size:11px;font-weight:600;font-stretch:80%;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin:14px 0 6px}
input,select{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:4px;padding:12px 13px;font:16px var(--sans)}input:focus,select:focus{outline:none;border-color:var(--accent)}
.auth{max-width:420px;margin:32px 0 0}.tabs{display:flex;border-bottom:1px solid var(--border);margin-bottom:6px}.tab{flex:1;padding:12px;background:none;border:0;border-bottom:2px solid transparent;color:var(--dim);font:700 12px var(--sans);font-stretch:80%;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}.tab.on{color:var(--text);border-bottom-color:var(--accent)}
.err{color:var(--danger);font-size:14px;margin-top:10px;min-height:1em}.ok{color:var(--accent);font-size:14px;margin-top:10px}
.feat{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:26px}.feat .card b{display:block;font-size:13px;font-stretch:82%;letter-spacing:.12em;text-transform:uppercase;margin-bottom:5px}.feat .card p{font:15px/1.5 var(--serif);color:var(--soft)}
.share{margin-top:4px;border-top:1px solid var(--border);padding-top:12px;display:none}.share.on{display:block}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}.li>span{flex:1;min-width:0}.li>button{flex:none}.li{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:14px;background:var(--panel2);border:1px solid var(--border);border-radius:4px;padding:8px 10px}
.link{font:13px ui-monospace,Menlo,monospace;word-break:break-all;background:var(--bg2);border:1px dashed var(--border2);padding:10px;border-radius:4px;margin-top:10px}
.empty{font:17px/1.5 var(--serif);color:var(--soft)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
footer{text-align:center;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--dim);font-stretch:80%;padding:30px 0}
</style></head><body>
<nav><a class="logo" href="/app">AMNI<span>-CONNECT</span></a><div class="who" id="who"></div></nav>
<main id="main"><p class="empty">Loading…</p></main>
<footer>Amni-Scient · End-to-end encrypted · Nothing watches you</footer>
<script>
const $=s=>document.querySelector(s),main=$('#main'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const api=async(p,o={})=>{const r=await fetch(p,{method:o.method||'GET',headers:{'Content-Type':'application/json'},body:o.body?JSON.stringify(o.body):undefined,credentials:'same-origin'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j};
const inviteToken=(location.pathname.match(/^\/invite\/([\w-]+)/)||[])[1];
let me=null,devices=[],openShare=null,pcOn=false;
const icon=p=>/mac|darwin/i.test(p)?'MAC':/^win/i.test(p)?'WIN':/linux/i.test(p)?'LNX':'PC';
const ago=t=>{if(!t)return 'never';const s=(Date.now()-t)/1000;return s<90?'just now':s<3600?Math.round(s/60)+' min ago':s<86400?Math.round(s/3600)+' h ago':Math.round(s/86400)+' d ago'};
async function boot(){const m=await api('/api/me');me=m.user;pcOn=m.passcode;paintWho();if(inviteToken)return invitePage();me?dashboard():landing()}
function paintWho(){$('#who').innerHTML=me?`<span>${esc(me.name)}</span><button class="btn s" onclick="logout()">Sign out</button>`:''}
async function logout(){await api('/api/logout',{method:'POST'});me=null;paintWho();inviteToken?invitePage():landing()}
function authForm(after){return `<div class="auth card"><div class="tabs">${pcOn?'<button class="tab on" data-t="pc">Passcode</button>':''}<button class="tab ${pcOn?'':'on'}" data-t="in">Sign in</button><button class="tab" data-t="up">Create account</button></div><form id="af"><div id="nameRow" style="display:${pcOn?'block':'none'}"><label>Your name</label><input id="an" autocomplete="name" placeholder="Shown to the computer's owner"></div><div id="loginRow" style="display:${pcOn?'none':'block'}"><label>Username or email</label><input id="al" autocomplete="username" autocapitalize="none"></div><label id="apl">${pcOn?'Passcode':'Password'}</label><input id="ap" type="password" autocomplete="current-password" required ${pcOn?'inputmode="numeric"':''}><div class="err" id="ae"></div><button class="btn p w" style="margin-top:14px" id="ab">${pcOn?'Enter':'Sign in'}</button></form></div>`}
function wireAuth(after){let mode=pcOn?'pc':'in';document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{mode=t.dataset.t;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===t));$('#nameRow').style.display=mode==='in'?'none':'block';$('#loginRow').style.display=mode==='pc'?'none':'block';$('#apl').textContent=mode==='pc'?'Passcode':'Password';$('#ap').inputMode=mode==='pc'?'numeric':'text';$('#ab').textContent=mode==='up'?'Create account':mode==='pc'?'Enter':'Sign in';$('#ap').autocomplete=mode==='up'?'new-password':'current-password'});
$('#af').onsubmit=async e=>{e.preventDefault();$('#ae').textContent='';$('#ab').disabled=true;try{const j=await api(mode==='pc'?'/api/passcode':mode==='up'?'/api/signup':'/api/login',{method:'POST',body:{login:$('#al').value,password:$('#ap').value,code:$('#ap').value,name:$('#an').value}});me=j.user;paintWho();after()}catch(x){$('#ae').textContent=x.message}$('#ab').disabled=false}}
function landing(){main.innerHTML=`<div class="eyebrow">Remote desktop</div><h1>Amni<br>Connect</h1><p class="lede">Reach your own computers from any browser. Share one with a friend when you choose. Everything else stays walled off.</p>${authForm()}<div class="feat"><div class="card"><b>Your computers</b><p>Link any number of machines. They dial out, so no ports, tunnels or VPNs.</p></div><div class="card"><b>Guests by invite</b><p>Send a link for one computer, view-only or with control, and revoke it any time.</p></div><div class="card"><b>End to end</b><p>Screen and input go peer to peer over DTLS. This site only introduces the two ends.</p></div></div>`;wireAuth(dashboard)}
async function dashboard(){if(!me)return landing();try{devices=(await api('/api/devices')).devices}catch(e){devices=[]}
const mine=devices.filter(d=>d.role==='owner'),shared=devices.filter(d=>d.role!=='owner'),pcUser=me.via==='passcode';
main.innerHTML=`<div class="eyebrow">Signed in as ${esc(me.name)}</div><h1>Your<br>computers</h1><h2>Computers</h2>${mine.length?`<div class="grid">${mine.map(card).join('')}</div>`:`<p class="empty">No computers yet. Open Amni-Connect on a computer, choose <b>Link to account</b>, and enter its code below.</p>`}
${pcUser?'':`<h2>Add a computer</h2><div class="card" style="max-width:520px"><form id="pf"><div class="two"><div><label>Code from the app</label><input id="pc" placeholder="XXXX-XXXX" autocapitalize="characters" autocomplete="off" required></div><div><label>Name (optional)</label><input id="pn" placeholder="e.g. Office PC"></div></div><div class="err" id="pe"></div><button class="btn p" style="margin-top:12px">Link computer</button></form></div>`}
${shared.length?`<h2>Shared with you</h2><div class="grid">${shared.map(card).join('')}</div>`:''}`;
$('#pf')&&($('#pf').onsubmit=async e=>{e.preventDefault();$('#pe').textContent='';try{await api('/api/devices/pair/claim',{method:'POST',body:{code:$('#pc').value,name:$('#pn').value}});dashboard()}catch(x){$('#pe').textContent=x.message}});
devices.forEach(d=>{const b=$('#c-'+d.id);b&&(b.onclick=()=>location.href='/viewer?code='+encodeURIComponent(d.id)+'&host='+encodeURIComponent(location.host))});if(openShare)share(openShare,true)}
function card(d){const owner=d.role==='owner';return `<div class="card dev"><div class="top"><div class="ico">${icon(d.platform)}</div><div style="min-width:0;flex:1"><div class="nm">${esc(d.name)}</div><div class="meta"><span class="dot ${d.online?'on':''}"></span>${d.online?'Online':(d.lastSeen?'Offline · seen '+ago(d.lastSeen):'Waiting for first connection')}${owner?'':` · from ${esc(d.owner)}`}</div></div><span class="chip ${owner?'o':'g'}">${owner?'Owner':d.role==='view'?'View only':'Guest'}</span></div>
<div class="row"><button class="btn p s" id="c-${d.id}" ${d.online?'':'disabled'}>Connect</button>${owner?`<button class="btn s" onclick="share('${d.id}')">Share</button><button class="btn s" onclick="rename('${d.id}')">Rename</button><button class="btn s d" onclick="removeDev('${d.id}')">Remove</button>`:''}</div>${owner?`<div class="share" id="s-${d.id}"></div>`:''}</div>`}
async function rename(id){const d=devices.find(x=>x.id===id);const n=prompt('Rename computer',d.name);if(n&&n.trim()){await api('/api/devices/'+id,{method:'PATCH',body:{name:n}});dashboard()}}
async function removeDev(id){const d=devices.find(x=>x.id===id);if(confirm(`Remove "${d.name}"? It will be unlinked and every guest loses access.`)){await api('/api/devices/'+id,{method:'DELETE'});dashboard()}}
async function share(id,keep){const el=$('#s-'+id);if(!el)return;if(el.classList.contains('on')&&!keep){el.classList.remove('on');openShare=null;return}openShare=id;el.classList.add('on');const a=await api('/api/devices/'+id+'/access');
el.innerHTML=`<div class="two"><div><label>Guest can</label><select id="ir-${id}"><option value="control">Control</option><option value="view">Only watch</option></select></div><div><label>Link works for</label><select id="id-${id}"><option value="1">1 day</option><option value="7" selected>7 days</option><option value="30">30 days</option></select></div><div><label>Access lasts</label><select id="ia-${id}"><option value="0">No limit</option><option value="1">1 day</option><option value="7">7 days</option><option value="30">30 days</option></select></div><div><label>Link is for</label><select id="im-${id}"><option value="1">1 person</option><option value="5">Up to 5</option></select></div></div><button class="btn p s" style="margin-top:10px" onclick="mkInvite('${id}')">Create invite link</button><div id="il-${id}"></div>
${a.guests.length?`<label>People with access</label><div class="list">${a.guests.map(g=>`<div class="li"><span>${esc(g.name)} <span class="chip">${g.role==='view'?'View':'Control'}</span>${g.exp?` <span class="meta">until ${new Date(g.exp).toLocaleDateString()}</span>`:''}</span><button class="btn s d" onclick="revokeGuest('${id}','${g.user}')">Revoke</button></div>`).join('')}</div>`:''}
${a.invites.length?`<label>Open invite links</label><div class="list">${a.invites.map(v=>`<div class="li"><span>${v.role==='view'?'View only':'Control'} · ${v.uses}/${v.max} used · expires ${new Date(v.exp).toLocaleDateString()}</span><button class="btn s d" onclick="revokeInvite('${id}','${v.id}')">Cancel</button></div>`).join('')}</div>`:''}`}
async function mkInvite(id){const j=await api('/api/devices/'+id+'/invites',{method:'POST',body:{role:$('#ir-'+id).value,days:$('#id-'+id).value,accessDays:$('#ia-'+id).value,max:$('#im-'+id).value}});const url=location.origin+j.path;await share(id,true);$('#il-'+id).innerHTML=`<div class="link">${esc(url)}</div><div class="row" style="margin-top:8px"><button class="btn s" onclick="navigator.clipboard.writeText('${url}');this.textContent='Copied'">Copy link</button>${navigator.share?`<button class="btn s" onclick="navigator.share({title:'Amni-Connect invite',url:'${url}'})">Send…</button>`:''}</div><div class="ok">Anyone with this link can join after signing in. Send it privately.</div>`}
async function revokeGuest(id,u){if(confirm('Revoke this person\'s access? They are disconnected right away.')){await api('/api/devices/'+id+'/guests/'+u,{method:'DELETE'});share(id,true)}}
async function revokeInvite(id,v){await api('/api/devices/'+id+'/invites/'+v,{method:'DELETE'});share(id,true)}
async function invitePage(){let inv;try{inv=await api('/api/invites/'+inviteToken)}catch(e){main.innerHTML=`<div class="eyebrow">Invite</div><h1>Link<br>expired</h1><p class="lede">${esc(e.message)}. Ask for a new one.</p><div style="margin-top:22px"><a class="btn" href="/app">Go to Amni-Connect</a></div>`;return}
main.innerHTML=`<div class="eyebrow">You're invited</div><h1>${esc(inv.device)}</h1><p class="lede">${esc(inv.owner)} is sharing this computer with you, ${inv.role==='view'?'view only':'with control'}.</p>${me?`<div class="card auth"><p class="empty">Signed in as ${esc(me.name)}.</p><div class="err" id="xe"></div><button class="btn p w" style="margin-top:14px" id="acc">Accept invite</button></div>`:authForm()}`;
const accept=async()=>{try{await api('/api/invites/'+inviteToken+'/accept',{method:'POST'});history.replaceState(null,'','/app');dashboard()}catch(x){($('#xe')||$('#ae')).textContent=x.message}};me?($('#acc').onclick=accept):wireAuth(accept)}
setInterval(()=>{if(me&&!inviteToken&&!openShare&&document.visibilityState==='visible')api('/api/devices').then(j=>{if(JSON.stringify(j.devices.map(d=>[d.id,d.online]))!==JSON.stringify(devices.map(d=>[d.id,d.online])))dashboard()}).catch(()=>{})},10000);
boot();
</script></body></html>
