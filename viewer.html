<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Amni-Connect Viewer</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{touch-action:manipulation}
:root{--paper:#0A0B0E;--surface:#161a22;--sunk:#1c212b;--ink:#eef1f6;--mut:#9aa3b2;--line:#2a3140;--you:#A88FE8;--you-ink:#0b0d12;--toolbar-h:56px}
body{background:var(--paper);color:var(--ink);font-family:system-ui,Segoe UI,sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
#connect-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;gap:16px}
.logo{font-size:20px;font-weight:700;color:var(--you);margin-bottom:8px;letter-spacing:-.02em}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;width:100%;max-width:400px;display:flex;flex-direction:column;gap:12px}
label{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.5px}
input{background:var(--sunk);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:16px;padding:14px 16px;width:100%;outline:none}
input:focus{border-color:var(--you)}
button{background:var(--you);border:none;border-radius:8px;color:var(--you-ink);font-size:15px;font-weight:600;padding:14px;width:100%;cursor:pointer;transition:background .2s}
button:active{background:#4f46e5}
button.danger{background:#ef4444}
#status-bar{background:color-mix(in srgb,var(--surface) 92%,transparent);padding:10px 16px;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
#status-text{flex:1;overflow:hidden;text-overflow:ellipsis;min-width:8em}
#link-chips{display:inline-flex;gap:6px;flex-wrap:wrap}
#link-chips span{font:650 10px/1.1 ui-monospace,Consolas,monospace;padding:3px 8px;border-radius:999px;border:1px solid var(--line);background:var(--sunk);color:var(--mut)}
#link-chips span.ok{color:#86efac;border-color:color-mix(in srgb,#86efac 35%,var(--line))}
#link-chips span.bad{color:#fda4af;border-color:color-mix(in srgb,#fda4af 35%,var(--line))}
#link-chips span.warn{color:var(--you);border-color:color-mix(in srgb,var(--you) 35%,var(--line))}
#signal-pill{display:none;align-items:center;gap:5px;padding:3px 9px;border-radius:9999px;background:rgba(255,255,255,0.06);font-size:11px;font-weight:600;letter-spacing:0.3px;flex-shrink:0}
#signal-pill.on{display:inline-flex}
#signal-dot{width:7px;height:7px;border-radius:50%;background:#64748b}
#viewer-screen{flex:1;display:none;position:relative;background:#000;overflow:hidden;min-height:0}
#zoom-container{position:absolute;top:0;left:0;right:0;bottom:var(--toolbar-h);transform-origin:0 0}
video,#remote-canvas{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}
#remote-canvas{display:none}
#touch-overlay{position:absolute;inset:0;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none}
#toolbar{position:absolute;left:0;right:0;bottom:0;display:flex;flex-wrap:nowrap;align-items:stretch;gap:6px;padding:8px 10px;background:rgba(0,0,0,.72);backdrop-filter:blur(8px);z-index:60;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:none;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom))}
#toolbar::-webkit-scrollbar{display:none}
#toolbar button{width:auto;min-width:52px;flex:0 0 auto;padding:10px 10px;font-size:12px;border-radius:6px;margin:0;white-space:nowrap}
#toolbar #zoom-out,#toolbar #zoom-in{min-width:44px;padding:10px 8px}
#toolbar #dc-btn{min-width:40px;padding:10px 12px}
#keyboard-bar{position:absolute;bottom:var(--toolbar-h);left:0;right:0;display:none;padding:8px;background:rgba(0,0,0,.92);z-index:55;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;max-height:min(58vh,calc(100% - var(--toolbar-h) - 44px));overflow-y:auto;padding-left:max(8px,env(safe-area-inset-left));padding-right:max(8px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom))}
#clipboard-bar{position:absolute;bottom:var(--toolbar-h);left:0;right:0;display:none;padding:10px;background:rgba(0,0,0,.8);z-index:54;max-height:min(50vh,calc(100% - var(--toolbar-h) - 44px));overflow-y:auto;padding-left:max(10px,env(safe-area-inset-left));padding-right:max(10px,env(safe-area-inset-right));padding-bottom:max(10px,env(safe-area-inset-bottom))}
#file-progress{position:absolute;bottom:var(--toolbar-h);left:0;right:0;display:none;padding:10px 14px;background:rgba(0,0,0,.85);z-index:56;padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
#mode-btn{background:#475569}
#zoom-btn{background:#3b82f6}
#kb-btn{background:#334155}
#dc-btn{background:#ef4444}
#keyboard-bar button{touch-action:manipulation}
#kb-display{display:flex;gap:6px;margin-bottom:6px;align-items:center}
#kb-text{flex:1;background:#1e2937;border:2px solid #475569;border-radius:8px;color:#fff;font-size:15px;padding:10px 12px;min-height:38px;max-height:72px;overflow-y:auto;font-family:monospace;word-break:break-all;white-space:pre-wrap;line-height:1.3}
.kb-clear-btn{background:#475569;border:none;border-radius:8px;color:#fff;font-size:12px;font-weight:600;padding:0 14px;cursor:pointer;width:72px;flex:0 0 72px;height:38px}
#kb-keys button,#kb-mods button{width:auto}
#kb-mods{display:flex;gap:4px;margin-bottom:5px}
.mod-btn{background:#334155;color:#fff;border:none;border-radius:6px;padding:7px 4px;font-size:11px;font-weight:600;flex:1;cursor:pointer;transition:background .15s;min-height:32px}
.mod-btn.active{background:#6366f1}
#kb-keys{display:flex;flex-direction:column;gap:4px}
.kb-row{display:flex;gap:3px;justify-content:center}
.kb-key{flex:1;min-width:0;background:#334155;color:#fff;border:none;border-radius:6px;padding:10px 0;font-size:15px;font-weight:500;cursor:pointer;transition:background .1s;min-height:40px;-webkit-tap-highlight-color:transparent}
.kb-key:active{background:#6366f1}
.kb-key.kb-mod{background:#1e293b;font-size:13px;flex:1.4;font-weight:700}
.kb-key.kb-mod.active{background:#6366f1}
.kb-key.kb-mod.locked{background:#22c55e}
.kb-key.kb-space{flex:5}
#drag-indicator{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:#6366f1;color:white;padding:5px 16px;border-radius:20px;font-size:12px;font-weight:700;letter-spacing:1px;pointer-events:none;z-index:200;box-shadow:0 2px 12px rgba(99,102,241,.6)}
#toast{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,.85);color:white;padding:10px 22px;border-radius:10px;font-size:14px;pointer-events:none;z-index:200;transition:opacity .35s}
@media (min-width:820px){
#connect-screen{padding:48px}
.card{max-width:440px}
#toolbar{left:50%;right:auto;transform:translateX(-50%);width:auto;gap:8px;border-radius:12px 12px 0 0;padding:8px 14px}
#toolbar button{flex:0 0 auto;min-width:88px;padding:10px 16px;font-size:13px}
#toolbar #zoom-out,#toolbar #zoom-in{min-width:54px}
#keyboard-bar{left:50%;right:auto;transform:translateX(-50%);width:min(880px,95vw);border-radius:12px 12px 0 0}
#clipboard-bar{left:50%;right:auto;transform:translateX(-50%);width:min(680px,95vw);border-radius:12px 12px 0 0}
.kb-key{min-height:34px;padding:8px 0;font-size:14px}
}
</style>
</head>
<body>

<div id="drag-indicator">&#9654; DRAG MODE</div>
<div id="toast"></div>
<div id="connect-screen">
  <div class="logo">Amni-Connect</div>
  <div class="card">
    <label>Host IP / Address</label>
    <input id="host-input" type="text" placeholder="192.168.1.x or hostname" autocomplete="off" autocorrect="off" autocapitalize="none">
    <label>Room Code</label>
    <input id="code-input" type="text" placeholder="Room code" maxlength="32" style="text-transform:uppercase;letter-spacing:4px;font-size:22px;font-family:monospace" autocorrect="off" autocapitalize="characters">
    <button onclick="connect()">Connect</button>
  </div>
</div>

<div id="status-bar"><span id="status-text">Ready</span><div id="link-chips"><span id="chip-sig">sig —</span><span id="chip-rtc">rtc —</span><span id="chip-in">input —</span></div><span id="signal-pill"><span id="signal-dot"></span><span id="signal-label">—</span></span></div>

<div id="viewer-screen">
  <div id="zoom-container">
    <video id="remote-video" autoplay playsinline muted></video>
    <canvas id="remote-canvas"></canvas>
    <div id="touch-overlay"></div>
  </div>
  <div id="keyboard-bar">
    <div id="kb-display">
      <div id="kb-text">&#8203;</div>
      <button class="kb-clear-btn" onclick="clearKb()">Clear</button>
    </div>
    <div id="kb-mods">
      <button class="mod-btn" data-mod="Ctrl">Ctrl</button>
      <button class="mod-btn" data-mod="Alt">Alt</button>
      <button class="mod-btn" data-mod="Meta">Win</button>
      <button class="mod-btn" data-mod="Tab">Tab</button>
      <button class="mod-btn" data-mod="Escape">Esc</button>
      <button class="mod-btn" data-mod="ArrowUp">&#8593;</button>
      <button class="mod-btn" data-mod="ArrowDown">&#8595;</button>
      <button class="mod-btn" data-mod="ArrowLeft">&#8592;</button>
      <button class="mod-btn" data-mod="ArrowRight">&#8594;</button>
    </div>
    <div id="kb-keys"></div>
  </div>
  <div id="clipboard-bar">
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between;color:#e2e8f0;font-size:12px;font-weight:600">
        <span>Clipboard Sync</span>
        <span onclick="toggleClipboard()" style="cursor:pointer;color:#94a3b8">&times; Close</span>
      </div>
      <textarea id="clip-input" rows="4" placeholder="Host clipboard will appear here. Type/paste to send back." style="width:100%;background:#1e2937;border:2px solid #475569;border-radius:8px;color:white;font-size:14px;padding:12px;outline:none;resize:none;"></textarea>
      <button onclick="sendClipboard(true)" style="padding:10px;background:#22c55e">Paste to PC</button>
    </div>
  </div>
  <div id="file-progress">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#e2e8f0;margin-bottom:6px"><span id="file-progress-name">Sending&hellip;</span><span id="file-progress-pct">0%</span></div>
    <div style="background:#334155;border-radius:6px;height:8px;overflow:hidden"><div id="file-progress-bar" style="background:#22c55e;height:100%;width:0%;transition:width .1s"></div></div>
  </div>
  <input type="file" id="file-input" style="display:none" onchange="uploadFile(this.files[0])">
  <div id="toolbar">
    <button id="mode-btn" onclick="toggleMode()">&#128433; Touch</button>
    <button id="zoom-out" onclick="zoom(1/1.25)" style="background:#3b82f6;flex:0.5">&#128269;-</button>
    <button id="zoom-in" onclick="zoom(1.25)" style="background:#3b82f6;flex:0.5">&#128269;+</button>
    <button id="paste-btn" onclick="pasteToPc()" style="background:#22c55e">Paste</button>
    <button id="mic-btn" onclick="toggleVoice()" style="background:#7c3aed">Mic</button>
    <button id="clip-btn" onclick="toggleClipboard()" style="background:#f59e0b">📋 Clip</button>
    <button id="file-btn" onclick="document.getElementById('file-input').click()" style="background:#14b8a6">&#128190; Send</button>
    <button id="kb-btn" onclick="toggleKeyboard()">&#9000; KB</button>
    <button id="dc-btn" onclick="disconnect()">&times;</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const urlParams = new URLSearchParams(window.location.search);
const savedHost = localStorage.getItem('amni-last-host');
const savedCode = localStorage.getItem('amni-last-code');
document.getElementById('host-input').value = urlParams.get('host') || savedHost || location.hostname || '';
document.getElementById('code-input').value = urlParams.get('code') || savedCode || '';
if (document.getElementById('host-input').value && document.getElementById('code-input').value.length >= 4) {
  setTimeout(connect, 300);
}

const ICE = [{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}];
let lastIce = { lan: false, label: '' };
function rfc1918(ip) {
  if (!ip) return false;
  if (ip.startsWith('10.') || ip.startsWith('192.168.') || ip.startsWith('169.254.')) return true;
  const m = String(ip).match(/^172\.(\d+)\./);
  return !!(m && +m[1] >= 16 && +m[1] <= 31);
}
let ourLan = '', peerLan = '';
function rewriteLocal(cand, ip) {
  if (!cand || !ip) return null;
  const init = typeof cand === 'string' ? { candidate: cand } : (cand.candidate !== undefined ? { ...cand } : cand.toJSON ? cand.toJSON() : cand);
  if (!init.candidate || !/\.local/i.test(init.candidate)) return null;
  return { ...init, candidate: init.candidate.replace(/[A-Za-z0-9\-]+\.local/i, ip) };
}
function mungeSdp(desc, ip) {
  if (!desc || !ip || !desc.sdp || !/\.local/i.test(desc.sdp)) return desc;
  return { type: desc.type, sdp: desc.sdp.replace(/[A-Za-z0-9\-]+\.local/gi, ip) };
}
async function setLocalMunged(desc) {
  const d = mungeSdp({ type: desc.type, sdp: desc.sdp }, ourLan);
  await pc.setLocalDescription(d);
  return d;
}
async function setRemoteMunged(desc) {
  await pc.setRemoteDescription(new RTCSessionDescription(mungeSdp({ type: desc.type, sdp: desc.sdp }, peerLan)));
}
function emitIce(candidate) {
  if (!candidate || !socket || !roomId) return;
  const init = candidate.toJSON ? candidate.toJSON() : candidate;
  socket.emit('ice-candidate', { roomId, candidate: init });
  const extra = rewriteLocal(init, ourLan);
  if (extra) socket.emit('ice-candidate', { roomId, candidate: extra });
}
function addIce(candidate) {
  if (!pc || !candidate) return;
  pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
  const extra = rewriteLocal(candidate, peerLan);
  if (extra) pc.addIceCandidate(new RTCIceCandidate(extra)).catch(() => {});
}
function classifyIcePath(pair, byId) {
  if (!pair) return { lan: false, label: '' };
  const loc = byId[pair.localCandidateId] || {}, rem = byId[pair.remoteCandidateId] || {};
  const lt = loc.candidateType || loc.type || '?', rt = rem.candidateType || rem.type || '?';
  const la = loc.address || loc.ip || '', ra = rem.address || rem.ip || '';
  const lan = (lt === 'host' && rt === 'host') || (rfc1918(la) && rfc1918(ra));
  return { lan, label: (lan ? 'lan' : 'wan') + ' ' + lt + '-' + rt };
}
function rankVideoCodec(c) {
  const m = (c.mimeType || '').toLowerCase();
  if (m === 'video/h264') return 0;
  if (m === 'video/vp9') return 1;
  if (m === 'video/av1') return 2;
  if (m === 'video/vp8') return 9;
  return 5;
}
function preferDesktopCodecs(peer) {
  const caps = RTCRtpSender.getCapabilities && RTCRtpSender.getCapabilities('video');
  if (!caps || !peer) return;
  const ordered = caps.codecs.slice().sort((a, b) => rankVideoCodec(a) - rankVideoCodec(b));
  peer.getTransceivers().forEach(t => { try { t.setCodecPreferences(ordered); } catch (e) {} });
}
let hwDec = null, hwParts = new Map(), hwCanvas = null, hwUsing = false;
function useHwSurface(on) {
  hwUsing = on;
  const v = document.getElementById('remote-video');
  const c = document.getElementById('remote-canvas');
  if (c) c.style.display = on ? 'block' : 'none';
  if (v) v.style.display = on ? 'none' : 'block';
}
function ensureHwDec(w, h, codec) {
  if (hwDec && hwDec.state !== 'closed') return hwDec;
  if (typeof VideoDecoder === 'undefined') return null;
  hwCanvas = document.getElementById('remote-canvas');
  const ctx = hwCanvas.getContext('2d', { alpha: false, desynchronized: true });
  hwCanvas.width = w || hwCanvas.width || 1920;
  hwCanvas.height = h || hwCanvas.height || 1080;
  hwDec = new VideoDecoder({
    output: (frame) => {
      if (hwCanvas.width !== frame.displayWidth || hwCanvas.height !== frame.displayHeight) {
        hwCanvas.width = frame.displayWidth;
        hwCanvas.height = frame.displayHeight;
      }
      ctx.drawImage(frame, 0, 0);
      frame.close();
    },
    error: () => { hwDec = null; }
  });
  try {
    hwDec.configure({ codec: codec || 'avc1.640028', codedWidth: hwCanvas.width, codedHeight: hwCanvas.height, optimizeForLatency: true, hardwareAcceleration: 'prefer-hardware' });
  } catch (e) { hwDec = null; return null; }
  useHwSurface(true);
  return hwDec;
}
function assembleScreen(buf) {
  const u8 = buf instanceof Uint8Array ? buf : new Uint8Array(buf);
  if (u8.byteLength < 6) return null;
  const kind = u8[0], flags = u8[1], seq = new DataView(u8.buffer, u8.byteOffset, u8.byteLength).getUint32(2, true);
  if (kind === 1) return { au: u8.subarray(6), key: !!(flags & 1) };
  if (kind !== 2 || u8.byteLength < 10) return null;
  const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
  const idx = dv.getUint16(6, true), total = dv.getUint16(8, true);
  let rec = hwParts.get(seq);
  if (!rec) { rec = { flags, total, got: [] }; hwParts.set(seq, rec); }
  rec.got[idx] = u8.subarray(10);
  if (rec.got.filter(Boolean).length < total) return null;
  let n = 0; rec.got.forEach(p => n += p.byteLength);
  const au = new Uint8Array(n); let o = 0;
  rec.got.forEach(p => { au.set(p, o); o += p.byteLength; });
  hwParts.delete(seq);
  if (hwParts.size > 8) hwParts.clear();
  return { au, key: !!(rec.flags & 1) };
}
function onScreenPacket(data) {
  const assembled = assembleScreen(data instanceof ArrayBuffer ? new Uint8Array(data) : data);
  if (!assembled) return;
  const dec = ensureHwDec(0, 0, 'avc1.640028');
  if (!dec || dec.state === 'closed') return;
  try {
    dec.decode(new EncodedVideoChunk({ type: assembled.key ? 'key' : 'delta', timestamp: performance.now() * 1000, data: assembled.au }));
  } catch (e) {}
  setStatus('Streaming \u25cf Live');
}
let socket, pc, roomId;
const statusEl = document.getElementById('status-text');
const setStatus = (t) => statusEl.textContent = t;
const sigPill = document.getElementById('signal-pill');
const sigDot = document.getElementById('signal-dot');
const sigLabel = document.getElementById('signal-label');
function classifySignal(loss, rtt) {
  const r = rtt || 0, l = loss || 0;
  if (r > 0.3 || l > 0.07) return { name: 'Poor', color: '#ef4444' };
  if (r > 0.15 || l > 0.03) return { name: 'Fair', color: '#f59e0b' };
  if (r > 0.07 || l > 0.01) return { name: 'Good', color: '#22c55e' };
  return r > 0 ? { name: 'Excellent', color: '#86efac' } : { name: '—', color: '#64748b' };
}
let viewerStatsLoop = null;
let priorRcvd = 0, priorLost = 0;
function startViewerStats() {
  if (viewerStatsLoop) clearInterval(viewerStatsLoop);
  sigPill.classList.add('on');
  viewerStatsLoop = setInterval(async () => {
    if (!pc) return;
    const s = await pc.getStats();
    let rtt = 0, loss = 0, haveRtt = false, haveLoss = false;
    const iceById = {};
    let icePair = null;
    s.forEach(r => {
      if (r.type === 'inbound-rtp' && r.kind === 'video') {
        const rcvd = r.packetsReceived || 0, lost = r.packetsLost || 0;
        const dRcvd = rcvd - priorRcvd, dLost = lost - priorLost;
        priorRcvd = rcvd; priorLost = lost;
        if (dRcvd + dLost > 0) { loss = Math.max(0, dLost / (dRcvd + dLost)); haveLoss = true; }
      }
      if (r.type === 'local-candidate' || r.type === 'remote-candidate') iceById[r.id] = r;
      if (r.type === 'candidate-pair' && (r.state === 'succeeded' || r.nominated)) {
        icePair = r;
        if (r.currentRoundTripTime != null) { rtt = r.currentRoundTripTime; haveRtt = true; }
      }
    });
    lastIce = classifyIcePath(icePair, iceById);
    const sig = classifySignal(loss, rtt);
    sigDot.style.background = sig.color;
    const rttMs = haveRtt ? Math.round(rtt * 1000) + 'ms' : '';
    const lossPct = haveLoss && loss > 0.001 ? ' · ' + (loss * 100).toFixed(1) + '%' : '';
    sigLabel.textContent = sig.name + (rttMs ? ' (' + rttMs + lossPct + ')' : '');
    paintLinkChips();
  }, 500);
}
function stopViewerStats() { if (viewerStatsLoop) { clearInterval(viewerStatsLoop); viewerStatsLoop = null; } sigPill.classList.remove('on'); }

function connect() {
  const host = document.getElementById('host-input').value.trim();
  const code = document.getElementById('code-input').value.trim().toUpperCase();
  if (!host) return setStatus('Enter host IP or address');
  if (code.length < 4) return setStatus('Room code must be at least 4 characters');
  wantStay = true; iceTries = 0;
  localStorage.setItem('amni-last-host', host);
  localStorage.setItem('amni-last-code', code);
  // location.port is EMPTY on default ports, so behind a tunnel or reverse proxy on 443
  // this fell back to 3389 and dialled a port that does not exist there. Signalling then
  // never connected, even though the page itself had loaded fine over https.
  const proto = location.protocol === 'https:' ? 'https' : 'http';
  const port = location.port || (proto === 'https' ? '443' : '3389');
  if (/^\d{1,3}(?:\.\d{1,3}){3}$/.test(host)) peerLan = host;
  const origin = /:\d+$/.test(host) ? `${proto}://${host}` : `${proto}://${host}:${port}`;
  socket = io(origin, { transports: ['websocket','polling'] });
  socket.on('connect', () => { setStatus('Connected to signaling server'); socket.emit('join-room', code); paintLinkChips(); });
  socket.on('connect_error', () => setStatus('Cannot reach host — check IP and ensure server is running'));
  socket.on('room-joined', (id) => {
    roomId = id;
    setStatus(`Joined room ${id} — waiting for stream\u2026`);
    document.getElementById('connect-screen').style.display = 'none';
    document.getElementById('viewer-screen').style.display = 'block';
    document.getElementById('toolbar').style.display = 'flex';
    requestAnimationFrame(() => { layoutViewerChrome(); requestAnimationFrame(layoutViewerChrome); });
    createPC();
  });
  socket.on('error', (msg) => setStatus(`Error: ${msg}`));
  socket.on('offer', async ({ offer }) => {
    if (!pc) createPC();
    await setRemoteMunged(offer);
    preferDesktopCodecs(pc);
    const answer = await setLocalMunged(await pc.createAnswer());
    socket.emit('answer', { roomId, answer });
    setStatus('WebRTC negotiating\u2026');
  });
  socket.on('answer', async ({ answer }) => { if (pc) await setRemoteMunged(answer); });
  socket.on('your-lan', (ip) => { ourLan = ip || ourLan; });
  socket.on('peer-lan', (ip) => { peerLan = ip || peerLan; });
  socket.on('ice-candidate', ({ candidate }) => addIce(candidate));
  socket.on('input-dropped', (d) => {
    const now = Date.now();
    if (now - inputWarnedAt > 4000) { inputWarnedAt = now; showToast(d.reason === 'no-room' ? 'Host room gone - reconnecting' : 'Host offline - input not applied'); }
  });
  socket.on('host-disconnected', () => {
    setStatus('Host dropped · waiting to reclaim…');
    paintLinkChips();
    setTimeout(() => { if (socket?.connected && roomId && wantStay) socket.emit('join-room', roomId); }, 2000);
  });
}

let dataChannel;
let incomingFile = null, incomingBuffers = [], incomingSize = 0;
let iceTries = 0, wantStay = true, recoverBusy = false;

function paintLinkChips() {
  const sig = document.getElementById('chip-sig');
  const rtc = document.getElementById('chip-rtc');
  const inn = document.getElementById('chip-in');
  if (sig) { const up = !!(socket && socket.connected); sig.textContent = up ? 'sig up' : 'sig down'; sig.className = up ? 'ok' : 'bad'; }
  const st = pc ? pc.connectionState : 'idle';
  if (rtc) { rtc.textContent = 'rtc ' + st + (lastIce.label ? ' ' + lastIce.label : ''); rtc.className = st === 'connected' ? (lastIce.lan ? 'ok' : 'warn') : (st === 'connecting' || st === 'new' ? 'warn' : 'bad'); }
  if (inn) { inn.textContent = 'input ' + (inputPath || 'none'); inn.className = inputPath === 'p2p' ? 'ok' : (inputPath === 'relay' ? 'warn' : 'bad'); }
}

async function recoverPc() {
  if (recoverBusy || !wantStay) return;
  recoverBusy = true;
  try {
    if (pc && iceTries < 3 && (pc.connectionState === 'failed' || pc.connectionState === 'disconnected')) {
      iceTries++;
      setStatus('ICE restart ' + iceTries);
      const offer = await setLocalMunged(await pc.createOffer({ iceRestart: true }));
      if (socket && roomId) socket.emit('offer', { roomId, offer });
      return;
    }
    try { pc && pc.close(); } catch (e) {}
    pc = null; dataChannel = null; inputChannel = null; iceTries = 0;
    createPC();
    setStatus('Rebuilding peer…');
  } catch (e) {
    try { pc && pc.close(); } catch (x) {}
    pc = null; createPC();
  } finally { recoverBusy = false; paintLinkChips(); }
}

function createPC() {
  pc = new RTCPeerConnection({ iceServers: ICE, iceCandidatePoolSize: 4 });
  pc.onicecandidate = ({ candidate }) => emitIce(candidate);
  pc.onconnectionstatechange = () => {
    setStatus(`WebRTC: ${pc.connectionState}`);
    paintLinkChips();
    if (pc.connectionState === 'connected') { iceTries = 0; startViewerStats(); }
    else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') { stopViewerStats(); recoverPc(); }
    else if (pc.connectionState === 'closed') stopViewerStats();
  };
  pc.ontrack = ({ streams }) => {
    const v = document.getElementById('remote-video');
    v.srcObject = streams[0];
    v.play().catch(()=>{});
    setStatus('Streaming \u25cf Live');
    startViewerStats();
  };
  pc.ondatachannel = (e) => {
    if (e.channel.label === 'screen') {
      e.channel.binaryType = 'arraybuffer';
      e.channel.onmessage = (ev) => { if (typeof ev.data !== 'string') onScreenPacket(ev.data); };
      return;
    }
    if (e.channel.label === 'input') { inputChannel = e.channel; inputChannel.onopen = () => paintLinkChips(); return; }
    dataChannel = e.channel;
    dataChannel.onopen = () => setStatus('WebRTC: connected (Data+Video)');
    dataChannel.onmessage = (ev) => {
      if (typeof ev.data === 'string') {
        const data = JSON.parse(ev.data);
        if (data.type === 'clipboard-sync') {
          const clipInput = document.getElementById('clip-input');
          if (clipInput.value !== data.text) {
            clipInput.value = data.text;
            try { navigator.clipboard.writeText(data.text).catch(()=>{}); } catch(e){}
          }
        } else if (data.type === 'file-meta') {
          incomingFile = data; incomingBuffers = []; incomingSize = 0;
          setStatus(`Receiving ${data.name}...`);
        }
      } else if (incomingFile) {
        incomingBuffers.push(ev.data);
        incomingSize += ev.data.byteLength;
        if (incomingSize >= incomingFile.size) {
          const blob = new Blob(incomingBuffers, { type: incomingFile.fileType });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = incomingFile.name; a.click();
          setStatus('Streaming \u25cf Live');
          incomingFile = null;
        }
      }
    };
  };
}

let inputPath = 'none', inputWarnedAt = 0, inputChannel = null;
function sendWire(obj) {
  if (inputChannel?.readyState === 'open') {
    try { inputChannel.send(JSON.stringify(obj)); return 'p2p'; } catch (e) {}
  }
  if (dataChannel?.readyState === 'open') {
    try { dataChannel.send(JSON.stringify(obj)); return 'p2p'; } catch (e) {}
  }
  return null;
}
function sendInput(event) {
  const via = sendWire({ type: 'input', ev: event });
  if (via) { inputPath = via; paintLinkChips(); return; }
  if (socket?.connected) { socket.emit('input-event', { ...event, roomId }); inputPath = 'relay'; paintLinkChips(); return; }
  inputPath = 'none'; paintLinkChips();
  const now = Date.now();
  if (now - inputWarnedAt > 4000) { inputWarnedAt = now; showToast('Input offline - reconnecting'); setStatus('Input offline - control not reaching host'); }
}
let lastRightClick = 0;
function sendRightClick() {
  const now = Date.now();
  if (now - lastRightClick < 350) return;
  lastRightClick = now;
  sendInput({ type: 'mouse-right-click' });
}

// ── File transfer ────────────────────────────────────────────────────────────
const fileProgress = document.getElementById('file-progress');
const fileProgressBar = document.getElementById('file-progress-bar');
const fileProgressPct = document.getElementById('file-progress-pct');
const fileProgressName = document.getElementById('file-progress-name');
function uploadFile(file) {
  if (!file || !roomId) return;
  const host = document.getElementById('host-input').value.trim();
  const port = location.port || 3389;
  const proto = location.protocol === 'https:' ? 'https' : 'http';
  const form = new FormData();
  form.append('roomId', roomId);
  form.append('file', file);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', `${proto}://${host}:${port}/upload`);
  fileProgress.style.display = 'block';
  fileProgressName.textContent = file.name;
  fileProgressBar.style.width = '0%';
  fileProgressPct.textContent = '0%';
  xhr.upload.onprogress = (e) => {
    if (!e.lengthComputable) return;
    const pct = Math.round((e.loaded / e.total) * 100);
    fileProgressBar.style.width = pct + '%';
    fileProgressPct.textContent = pct + '%';
  };
  xhr.onload = () => {
    fileProgress.style.display = 'none';
    document.getElementById('file-input').value = '';
    showToast(xhr.status === 200 ? `Sent ${file.name}` : 'Send failed');
  };
  xhr.onerror = () => { fileProgress.style.display = 'none'; showToast('Send failed'); };
  xhr.send(form);
}

// ── Visual feedback ──────────────────────────────────────────────────────────
const dragIndicator = document.getElementById('drag-indicator');
const toastEl = document.getElementById('toast');
let toastTimer = null;
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.style.display = 'block';
  toastEl.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toastEl.style.opacity = '0'; setTimeout(() => toastEl.style.display = 'none', 380); }, 900);
}
function setDragMode(on) {
  dragIndicator.style.display = on ? 'block' : 'none';
}

// ── View state ───────────────────────────────────────────────────────────────
const overlay = document.getElementById('touch-overlay');
let panX = 0, panY = 0, currentZoom = 1;
let lastSrcSize = { w: 0, h: 0 };

function sourceSize() {
  const c = document.getElementById('remote-canvas');
  if (hwUsing && c && c.width) { lastSrcSize = { w: c.width, h: c.height }; return lastSrcSize; }
  const v = document.getElementById('remote-video');
  let w = v.videoWidth, h = v.videoHeight;
  if ((!w || !h) && pc) {
    const t = pc.getReceivers().map(r => r.track).find(t => t && t.kind === 'video');
    const s = t && t.getSettings && t.getSettings();
    if (s && s.width && s.height) { w = s.width; h = s.height; }
  }
  if (w && h) lastSrcSize = { w, h };
  else if (lastSrcSize.w) return lastSrcSize;
  return { w: w || 0, h: h || 0 };
}
function getVideoRect() {
  const { w: vw, h: vh } = sourceSize();
  const r = overlay.getBoundingClientRect();
  if (!vw || !vh) return { left: r.left, top: r.top, width: r.width, height: r.height };
  const cAR = r.width / r.height, vAR = vw / vh;
  const dW = vAR > cAR ? r.width : r.height * vAR;
  const dH = vAR > cAR ? r.width / vAR : r.height;
  return { left: r.left + (r.width - dW) / 2, top: r.top + (r.height - dH) / 2, width: dW, height: dH };
}

function screenCoord(clientX, clientY) {
  const vr = getVideoRect();
  return {
    x: Math.max(0, Math.min(1, (clientX - vr.left) / vr.width)),
    y: Math.max(0, Math.min(1, (clientY - vr.top)  / vr.height))
  };
}

function clampPan() {
  const vw = overlay.clientWidth, vh = overlay.clientHeight;
  panX = Math.min(0, Math.max(vw - vw * currentZoom, panX));
  panY = Math.min(0, Math.max(vh - vh * currentZoom, panY));
}

function updateCrisp() {
  const mode = currentZoom > 1.02 ? 'pixelated' : 'auto';
  const v = document.getElementById('remote-video');
  const c = document.getElementById('remote-canvas');
  if (v) v.style.imageRendering = mode;
  if (c) c.style.imageRendering = mode;
}
function applyTransform(instant) {
  const c = document.getElementById('zoom-container');
  c.style.transition = 'none';
  c.style.transform = `translate(${panX}px,${panY}px) scale(${currentZoom})`;
  updateCrisp();
}

// ── Zoom — multiplicative, cap scales with source resolution ──────────────────
const ZOOM_MIN = 0.5, ZOOM_HARD_MAX = 32, ZOOM_STEP = 1.25, ZOOM_PX_PER_SRC = 4;
function maxZoom() {
  const src = sourceSize(), base = getVideoRect().width / currentZoom;
  return !src.w || !base ? 8 : Math.min(ZOOM_HARD_MAX, Math.max(4, src.w / base * ZOOM_PX_PER_SRC));
}
function setZoom(next, clientX, clientY) {
  const prev = currentZoom, r = document.getElementById('zoom-container').getBoundingClientRect();
  currentZoom = Math.max(ZOOM_MIN, Math.min(maxZoom(), next));
  if (currentZoom === prev) return false;
  const k = currentZoom / prev, ax = clientX - r.left, ay = clientY - r.top;
  panX = ax - (ax - panX) * k;
  panY = ay - (ay - panY) * k;
  clampPan();
  return true;
}
function zoom(factor) {
  const r = document.getElementById('zoom-container').getBoundingClientRect();
  setZoom(currentZoom * factor, r.left + r.width / 2, r.top + r.height / 2) &&
    (applyTransform(false), showToast(`${currentZoom.toFixed(currentZoom < 10 ? 1 : 0)}×`));
}

// ── Touch gesture state ──────────────────────────────────────────────────────
const LONG_PRESS_MS  = 520;   // ms hold → right click
const DOUBLE_TAP_MS  = 300;   // ms between taps for double-tap
const DOUBLE_TAP_PX  = 38;    // max distance between taps
const DRAG_THRESHOLD = 9;     // px before a move counts as a drag

let lastTouch = null, touchStartPos = null, isDragging = false;
let pinchLast = null, pinchMoved = false;
let triLast = null;
let maxTouchCount = 0;

// Long-press → right-click
let longPressTimer = null;

// Double-tap-hold → drag lock
let lastTapTime = 0, lastTapPos = null;
let isDragLock = false, dragLockActive = false;

let touchMode = 'touch';
let lastTouchTs = 0;

// ── touchstart ───────────────────────────────────────────────────────────────
overlay.addEventListener('touchstart', (e) => {
  e.preventDefault();
  lastTouchTs = Date.now();
  maxTouchCount = Math.max(maxTouchCount, e.touches.length);

  if (e.touches.length === 2) {
    // Cancel any single-finger state
    clearTimeout(longPressTimer); longPressTimer = null;
    if (isDragLock && dragLockActive) {
      sendInput({ type: 'mouse-up' }); setDragMode(false);
      isDragLock = false; dragLockActive = false;
    }
    const t0 = e.touches[0], t1 = e.touches[1];
    const cx = (t0.clientX + t1.clientX) / 2;
    const cy = (t0.clientY + t1.clientY) / 2;
    pinchLast = { dist: Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY), cx, cy };
    pinchMoved = false;
    lastTouch = null; isDragging = false;
    return;
  }

  if (e.touches.length >= 3) {
    clearTimeout(longPressTimer); longPressTimer = null;
    if (isDragLock && dragLockActive) {
      sendInput({ type: 'mouse-up' }); setDragMode(false);
      isDragLock = false; dragLockActive = false;
    }
    let cx = 0, cy = 0;
    for (let i = 0; i < e.touches.length; i++) { cx += e.touches[i].clientX; cy += e.touches[i].clientY; }
    cx /= e.touches.length; cy /= e.touches.length;
    triLast = { cx, cy };
    pinchLast = null; lastTouch = null; isDragging = false;
    return;
  }

  // Single finger
  pinchLast = null;
  const t = e.touches[0];
  touchStartPos = { x: t.clientX, y: t.clientY };
  lastTouch = t;
  isDragging = false;

  // Detect second tap of a double-tap (for drag lock)
  const now = Date.now();
  if (!isDragLock && lastTapPos &&
      now - lastTapTime < DOUBLE_TAP_MS &&
      Math.hypot(t.clientX - lastTapPos.x, t.clientY - lastTapPos.y) < DOUBLE_TAP_PX) {
    isDragLock = true; dragLockActive = false;
    lastTapTime = 0; lastTapPos = null;
    return; // skip long-press setup
  }

  // Long press → right click
  longPressTimer = setTimeout(() => {
    longPressTimer = null;
    if (!isDragging && touchStartPos && !isDragLock) {
      if (touchMode !== 'trackpad') {
        const sc = screenCoord(touchStartPos.x, touchStartPos.y);
        sendInput({ type: 'mouse-move', x: sc.x, y: sc.y });
      }
      sendRightClick();
      showToast('Right Click');
      touchStartPos = null; // suppress tap on release
    }
  }, LONG_PRESS_MS);
}, { passive: false });

// ── touchmove ────────────────────────────────────────────────────────────────
overlay.addEventListener('touchmove', (e) => {
  e.preventDefault();

  // ── Three-finger: scroll host (works at any zoom) ────────────────────────
  if (e.touches.length >= 3 && triLast) {
    let cx = 0, cy = 0;
    for (let i = 0; i < e.touches.length; i++) { cx += e.touches[i].clientX; cy += e.touches[i].clientY; }
    cx /= e.touches.length; cy /= e.touches.length;
    const dcx = cx - triLast.cx, dcy = cy - triLast.cy;
    if (Math.abs(dcx) > 1 || Math.abs(dcy) > 1) pinchMoved = true;
    const sx = Math.round(dcx / 18), sy = Math.round(dcy / 18);
    if (sx !== 0 || sy !== 0) {
      sendInput({ type: 'mouse-scroll', dx: sx, dy: sy });
      triLast = { cx, cy };
    }
    return;
  }

  // ── Two-finger: exactly one of {zoom, pan, scroll} per frame ─────────────
  if (e.touches.length === 2 && pinchLast) {
    const t0 = e.touches[0], t1 = e.touches[1];
    const cx = (t0.clientX + t1.clientX) / 2;
    const cy = (t0.clientY + t1.clientY) / 2;
    const newDist = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
    const dcx = cx - pinchLast.cx;
    const dcy = cy - pinchLast.cy;
    const scaleRatio = newDist / pinchLast.dist;
    const isZooming = Math.abs(scaleRatio - 1) > 0.025;

    if (Math.abs(dcx) > 1 || Math.abs(dcy) > 1 || isZooming) pinchMoved = true;

    if (isZooming) {
      setZoom(currentZoom * scaleRatio, cx, cy);
    } else if (currentZoom > 1.05) {
      panX += dcx; panY += dcy;
    } else {
      const sx = Math.round(dcx / 22), sy = Math.round(dcy / 22);
      if (sx !== 0 || sy !== 0) sendInput({ type: 'mouse-scroll', dx: sx, dy: sy });
    }
    clampPan(); applyTransform(true);
    pinchLast = { dist: newDist, cx, cy };
    return;
  }

  if (!lastTouch || e.touches.length !== 1) return;
  const t = e.touches[0];
  const pxDx = t.clientX - lastTouch.clientX;
  const pxDy = t.clientY - lastTouch.clientY;

  if (!isDragging && touchStartPos &&
      Math.hypot(t.clientX - touchStartPos.x, t.clientY - touchStartPos.y) > DRAG_THRESHOLD) {
    isDragging = true;
    clearTimeout(longPressTimer); longPressTimer = null;
  }

  // ── Drag lock: button held while moving ───────────────────────────────────
  if (isDragLock) {
    if (!dragLockActive && isDragging) {
      // First confirmed movement: press and hold mouse button
      if (touchMode !== 'trackpad') {
        const sc = screenCoord(touchStartPos.x, touchStartPos.y);
        sendInput({ type: 'mouse-move', x: sc.x, y: sc.y });
      }
      sendInput({ type: 'mouse-down' });
      dragLockActive = true; setDragMode(true);
    }
    if (dragLockActive) {
      if (touchMode === 'trackpad') {
        const vr = getVideoRect();
        sendInput({ type: 'mouse-move-rel', dx: pxDx / vr.width, dy: pxDy / vr.height });
      } else {
        const sc = screenCoord(t.clientX, t.clientY);
        sendInput({ type: 'mouse-move', x: sc.x, y: sc.y });
      }
    }
    lastTouch = t; return;
  }

  // ── Normal single-finger move ─────────────────────────────────────────────
  if (touchMode === 'trackpad') {
    const vr = getVideoRect();
    sendInput({ type: 'mouse-move-rel', dx: pxDx / vr.width, dy: pxDy / vr.height });
  } else {
    const sc = screenCoord(t.clientX, t.clientY);
    sendInput({ type: 'mouse-move', x: sc.x, y: sc.y });
  }
  lastTouch = t;
}, { passive: false });

// ── touchend ─────────────────────────────────────────────────────────────────
overlay.addEventListener('touchend', (e) => {
  e.preventDefault();
  lastTouchTs = Date.now();
  const allUp = e.touches.length === 0;

  // Transitioning from multi to single touch — reset pinch but keep single-touch going
  if (!allUp && (pinchLast !== null || triLast !== null)) {
    pinchLast = null; triLast = null;
    // pinchMoved intentionally NOT reset here — kept for allUp tap detection
    if (e.touches.length === 1) { lastTouch = e.touches[0]; touchStartPos = { x: lastTouch.clientX, y: lastTouch.clientY }; isDragging = false; }
    else if (e.touches.length === 2) {
      const t0 = e.touches[0], t1 = e.touches[1];
      pinchLast = { dist: Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY), cx: (t0.clientX + t1.clientX) / 2, cy: (t0.clientY + t1.clientY) / 2 };
    }
    return;
  }

  // ── All fingers lifted: check for multi-finger tap gestures ──────────────
  if (allUp && maxTouchCount >= 2) {
    const savedCount = maxTouchCount;
    const savedMoved = pinchMoved;
    pinchLast = null; triLast = null; pinchMoved = false; maxTouchCount = 0;
    lastTouch = null; touchStartPos = null; isDragging = false;
    if (!savedMoved) {
      if (savedCount >= 3) { sendInput({ type: 'mouse-middle-click' }); showToast('Middle Click'); }
      else                 { sendRightClick(); showToast('Right Click');  }
    }
    return;
  }

  clearTimeout(longPressTimer); longPressTimer = null;

  // ── End drag lock ─────────────────────────────────────────────────────────
  if (isDragLock) {
    if (dragLockActive) {
      sendInput({ type: 'mouse-up' }); setDragMode(false);
    } else if (!isDragging && touchStartPos) {
      // Second tap released quickly without drag → treat as normal click
      if (touchMode !== 'trackpad') {
        const sc = screenCoord(touchStartPos.x, touchStartPos.y);
        sendInput({ type: 'mouse-move', x: sc.x, y: sc.y });
      }
      sendInput({ type: 'mouse-click' });
    }
    isDragLock = false; dragLockActive = false;
    lastTouch = null; touchStartPos = null; isDragging = false;
    maxTouchCount = 0; return;
  }

  // ── Normal tap ────────────────────────────────────────────────────────────
  if (!isDragging && touchStartPos) {
    lastTapTime = Date.now();
    lastTapPos = { x: touchStartPos.x, y: touchStartPos.y };
    if (touchMode === 'trackpad') {
      sendInput({ type: 'mouse-click' });
    } else {
      const sc = screenCoord(touchStartPos.x, touchStartPos.y);
      sendInput({ type: 'mouse-move', x: sc.x, y: sc.y });
      sendInput({ type: 'mouse-click' });
    }
  }

  lastTouch = null; touchStartPos = null; isDragging = false; maxTouchCount = 0;
}, { passive: false });

overlay.addEventListener('contextmenu', (e) => { e.preventDefault(); sendRightClick(); });

// ── Desktop / laptop input: physical mouse, wheel, hardware keyboard ───────────
let mouseHeld = false;
const desktopActive = () => Date.now() - lastTouchTs > 700;
overlay.addEventListener('mousedown', (e) => {
  if (!desktopActive()) return;

  e.button === 2 ? sendRightClick() : e.button === 1 ? sendInput({ type: 'mouse-middle-click' }) : (mouseHeld = true, sendInput({ type: 'mouse-down' }));
});
overlay.addEventListener('mousemove', (e) => {
  if (!desktopActive()) return;

overlay.addEventListener('dblclick', (e) => e.preventDefault());
overlay.addEventListener('wheel', (e) => {
  if (!desktopActive()) return;
  e.preventDefault();
  if (e.ctrlKey) { setZoom(currentZoom * (e.deltaY < 0 ? ZOOM_STEP : 1 / ZOOM_STEP), e.clientX, e.clientY) && applyTransform(false); return; }
  const sx = e.deltaX ? (e.deltaX > 0 ? 1 : -1) : 0, sy = e.deltaY ? (e.deltaY > 0 ? 1 : -1) : 0;
  (sx || sy) && sendInput({ type: 'mouse-scroll', dx: sx, dy: sy });
}, { passive: false });
const PHYS_MODS = ['Control', 'Shift', 'Alt', 'Meta'];
const PASS_KEYS = ['F5', 'F11', 'F12'];
const kbCaptureOn = () => document.getElementById('viewer-screen').style.display !== 'none' && !['INPUT', 'TEXTAREA'].includes((document.activeElement || {}).tagName);
const physHeld = new Set();
function keyFromDom(e) {
  const k = e.key === ' ' ? 'Space' : e.key;
  return { type: e.type === 'keyup' ? 'key-up' : 'key-down', key: k, code: e.code };
}
document.addEventListener('keydown', (e) => {
  if (!kbCaptureOn() || PASS_KEYS.includes(e.key)) return;
  e.preventDefault();
  if (e.repeat && PHYS_MODS.includes(e.key)) return;
  physHeld.add(e.key);
  sendInput(keyFromDom(e));
});
document.addEventListener('keyup', (e) => {
  if (PASS_KEYS.includes(e.key)) return;
  physHeld.delete(e.key);
  if (!kbCaptureOn()) return;
  e.preventDefault();
  sendInput(keyFromDom(e));
});
const releaseHeld = () => { physHeld.forEach(k => sendInput({ type: 'key-up', key: k })); physHeld.clear(); };
window.addEventListener('blur', releaseHeld);

const KB_ROWS_LOWER = ['1234567890', 'qwertyuiop', 'asdfghjkl', 'zxcvbnm'];
const KB_ROWS_UPPER = ['!@#$%^&*()', 'QWERTYUIOP', 'ASDFGHJKL', 'ZXCVBNM'];
const KB_ROWS_SYM   = ['1234567890', '-_=+[]{}\\|', ';:\'",.<>/?', '`~!@#$%^&*'];
const kbTextEl = document.getElementById('kb-text');
const kbKeysEl = document.getElementById('kb-keys');
let kbShift = false, kbCaps = false, kbLayout = 'abc';
let kbMods = { Ctrl: false, Alt: false, Meta: false };
let kbBuffer = '';

function renderKbText() {
  kbTextEl.textContent = kbBuffer || '\u200b';
  kbTextEl.scrollTop = kbTextEl.scrollHeight;
}

function renderKbMods() {
  document.querySelectorAll('#kb-mods .mod-btn').forEach(b => {
    const m = b.dataset.mod;
    b.classList.toggle('active', !!kbMods[m]);
  });
}

let repStop = null;
function stopRepeat() { if (repStop) { repStop(); repStop = null; } }
function bindPress(el, fn, repeat) {
  let fired = false;
  el.style.touchAction = 'none';
  el.style.webkitUserSelect = 'none';
  el.style.userSelect = 'none';
  el.style.webkitTouchCallout = 'none';
  el.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); });
  el.addEventListener('selectstart', (e) => e.preventDefault());
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (fired) return;
    fired = true; fn();
    setTimeout(() => { fired = false; }, 40);
    if (repeat) {
      stopRepeat();
      const hold = setTimeout(() => { const iv = setInterval(fn, 55); repStop = () => clearInterval(iv); }, 380);
      repStop = () => clearTimeout(hold);
    }
  });
  el.addEventListener('click', (e) => e.preventDefault());
}
document.addEventListener('pointerup', stopRepeat);
document.addEventListener('pointercancel', stopRepeat);

function renderKbKeys() {
  const rows = kbLayout === 'sym' ? KB_ROWS_SYM : (kbShift || kbCaps ? KB_ROWS_UPPER : KB_ROWS_LOWER);
  kbKeysEl.innerHTML = '';
  rows.forEach((row, idx) => {
    const rowEl = document.createElement('div');
    rowEl.className = 'kb-row';
    if (idx === 3) {
      const sh = document.createElement('button');
      sh.className = 'kb-key kb-mod' + (kbCaps ? ' locked' : kbShift ? ' active' : '');
      sh.textContent = kbCaps ? 'CAPS' : '\u21E7';
      bindPress(sh, toggleShift);
      rowEl.appendChild(sh);
    }
    for (const ch of row) {
      const b = document.createElement('button');
      b.className = 'kb-key';
      b.textContent = ch;
      bindPress(b, () => tapChar(ch), true);
      rowEl.appendChild(b);
    }
    if (idx === 3) {
      const bk = document.createElement('button');
      bk.className = 'kb-key kb-mod';
      bk.textContent = '\u232B';
      bindPress(bk, () => tapSpecial('Backspace'), true);
      rowEl.appendChild(bk);
    }
    kbKeysEl.appendChild(rowEl);
  });
  const lastRow = document.createElement('div');
  lastRow.className = 'kb-row';
  const lay = document.createElement('button');
  lay.className = 'kb-key kb-mod';
  lay.textContent = kbLayout === 'sym' ? 'ABC' : '!#1';
  bindPress(lay, toggleLayout);
  const sp = document.createElement('button');
  sp.className = 'kb-key kb-space';
  sp.textContent = 'space';
  bindPress(sp, () => tapChar(' '), true);
  const en = document.createElement('button');
  en.className = 'kb-key kb-mod';
  en.textContent = '\u23CE';
  bindPress(en, () => tapSpecial('Enter'));
  lastRow.appendChild(lay);
  lastRow.appendChild(sp);
  lastRow.appendChild(en);
  kbKeysEl.appendChild(lastRow);
}

function activeMods() {
  return Object.keys(kbMods).filter(k => kbMods[k]);
}

const SHIFTED_SYMBOLS = {'!':'1','@':'2','#':'3','$':'4','%':'5','^':'6','&':'7','*':'8','(':'9',')':'0','_':'-','+':'=','{':'[','}':']','|':'\\',':':';','"':"'",'<':',','>':'.','?':'/','~':'`'};

function sendWithMods(key, withShift) {
  const mods = activeMods();
  let realKey = key;
  let autoShift = false;
  if (SHIFTED_SYMBOLS[key]) { realKey = SHIFTED_SYMBOLS[key]; autoShift = true; }
  else if (key.length === 1 && key >= 'A' && key <= 'Z') { realKey = key.toLowerCase(); autoShift = true; }
  if ((withShift && (kbShift || kbCaps)) || autoShift) {
    if (!mods.includes('Shift')) mods.push('Shift');
  }
  mods.forEach(m => sendInput({ type: 'key-down', key: m }));
  sendInput({ type: 'key-down', key: realKey });
  sendInput({ type: 'key-up', key: realKey });
  mods.slice().reverse().forEach(m => sendInput({ type: 'key-up', key: m }));
  const hadStickyMods = activeMods().length > 0;
  if (hadStickyMods) {
    Object.keys(kbMods).forEach(m => kbMods[m] = false);
    renderKbMods();
  }
}

function tapChar(ch) {
  let out = ch;
  if (kbLayout !== 'sym' && /[a-z]/.test(ch) && (kbShift || kbCaps)) out = ch.toUpperCase();
  sendWithMods(out, false);
  kbBuffer += out;
  renderKbText();
  if (kbShift && !kbCaps) { kbShift = false; renderKbKeys(); }
}

function tapSpecial(key) {
  sendWithMods(key, true);
  if (kbShift && !kbCaps) { kbShift = false; renderKbKeys(); }
  if (key === 'Backspace') kbBuffer = kbBuffer.slice(0, -1);
  else if (key === 'Enter') kbBuffer = '';
  renderKbText();
}

function toggleShift() {
  kbCaps ? (kbCaps = false, kbShift = false) : kbShift ? (kbShift = false, kbCaps = true) : (kbShift = true);
  renderKbKeys();
}

function toggleLayout() {
  kbLayout = kbLayout === 'sym' ? 'abc' : 'sym';
  renderKbKeys();
}

function clearKb() {
  activeMods().forEach(m => sendInput({ type: 'key-up', key: m }));
  kbBuffer = ''; kbShift = false; kbCaps = false;
  kbMods = { Ctrl: false, Alt: false, Meta: false };
  renderKbText(); renderKbMods(); renderKbKeys();
}

document.querySelectorAll('#kb-mods .mod-btn').forEach(btn => {
  const m = btn.dataset.mod;
  bindPress(btn, () => {
    if (m in kbMods) { kbMods[m] = !kbMods[m]; renderKbMods(); }
    else tapSpecial(m);
  }, m.indexOf('Arrow') === 0);
});
const kbClearBtn = document.querySelector('.kb-clear-btn');
if (kbClearBtn) { kbClearBtn.onclick = null; bindPress(kbClearBtn, clearKb); }

function layoutViewerChrome() {
  const tb = document.getElementById('toolbar');
  if (!tb || getComputedStyle(tb).display === 'none') return;
  document.documentElement.style.setProperty('--toolbar-h', Math.ceil(tb.getBoundingClientRect().height) + 'px');
}
const _tbEl = document.getElementById('toolbar');
if (_tbEl && typeof ResizeObserver !== 'undefined') new ResizeObserver(layoutViewerChrome).observe(_tbEl);
window.addEventListener('resize', layoutViewerChrome);
if (window.visualViewport) window.visualViewport.addEventListener('resize', layoutViewerChrome);
const _remoteVideo = document.getElementById('remote-video');
if (_remoteVideo) _remoteVideo.addEventListener('loadedmetadata', () => { lastSrcSize = { w: 0, h: 0 }; sourceSize(); });

function toggleKeyboard() {
  const bar = document.getElementById('keyboard-bar');
  const visible = bar.style.display === 'block';
  bar.style.display = visible ? 'none' : 'block';
  if (!visible) {
    document.getElementById('clipboard-bar').style.display = 'none';
    renderKbKeys(); renderKbText(); renderKbMods();
    layoutViewerChrome();
    requestAnimationFrame(layoutViewerChrome);
  }
}

function toggleClipboard() {
  const bar = document.getElementById('clipboard-bar');
  const visible = bar.style.display === 'block';
  bar.style.display = visible ? 'none' : 'block';
  if (!visible) {
    document.getElementById('keyboard-bar').style.display = 'none';
    layoutViewerChrome();
  }
}

function sendPaste(text) {
  if (!text) return false;
  const via = sendWire({ type: 'paste', text });
  if (via) { showToast('Pasted to PC'); return true; }
  showToast('Not connected');
  return false;
}
async function pasteToPc() {
  let text = '';
  try { text = await navigator.clipboard.readText(); } catch (e) {}
  if (text && sendPaste(text)) return;
  document.getElementById('clipboard-bar').style.display = 'block';
  const box = document.getElementById('clip-input');
  box.focus();
  box.select();
  showToast('Paste here, then Paste to PC');
}
function sendClipboard(doPaste) {
  const text = document.getElementById('clip-input').value;
  if (!text) return showToast('Nothing to paste');
  if (doPaste) { sendPaste(text); return; }
  if (sendWire({ type: 'clipboard-sync', text })) showToast('Clipboard sent');
  try { navigator.clipboard.writeText(text).catch(()=>{}); } catch(e){}
}
let voiceRec = null, voiceOn = false;
function toggleVoice() {
  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
  const btn = document.getElementById('mic-btn');
  if (!Rec) { showToast('Voice needs Chrome'); return; }
  if (voiceOn && voiceRec) { try { voiceRec.stop(); } catch (e) {} return; }
  voiceRec = new Rec();
  voiceRec.lang = navigator.language || 'en-US';
  voiceRec.interimResults = false;
  voiceRec.continuous = false;
  voiceRec.onresult = (e) => {
    const t = Array.from(e.results).map(r => r[0].transcript).join(' ').trim();
    if (t) sendPaste(t);
  };
  voiceRec.onerror = () => { voiceOn = false; if (btn) btn.textContent = 'Mic'; };
  voiceRec.onend = () => { voiceOn = false; if (btn) btn.textContent = 'Mic'; };
  try { voiceRec.start(); voiceOn = true; if (btn) btn.textContent = 'Listening'; showToast('Listening…'); }
  catch (e) { showToast('Mic blocked'); }
}

function disconnect() {
  wantStay = false;
  pc?.close(); socket?.disconnect(); stopViewerStats();
  document.getElementById('viewer-screen').style.display = 'none';
  document.getElementById('connect-screen').style.display = 'flex';
  setStatus('Disconnected');
  paintLinkChips();
}

function toggleMode() {
  touchMode = touchMode === 'touch' ? 'trackpad' : 'touch';
  document.getElementById('mode-btn').textContent = touchMode === 'touch' ? '\uD83D\uDDB1\uFE0F Touch' : '\uD83D\uDD32 Pad';
}
</script>
