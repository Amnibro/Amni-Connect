<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amni-Connect &bull; E2EE Remote Desktop</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
        :root { --primary: #5A48B0; --primary-dark: #463890; --paper:#0A0B0E; --surface:#161a22; --you:#C89B4E; --ink:#eef1f6; --line:#2a3140; --mut:#9aa3b2; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: system-ui, Segoe UI, sans-serif; background: var(--paper); color: var(--ink); height: 100vh; overflow: hidden; }
        .container { display: flex; flex-direction: column; height: 100vh; }
        header { flex-shrink: 0; background: color-mix(in srgb,var(--surface) 92%,transparent); padding: 12px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); gap: 12px; }
        .logo { font-size: 20px; font-weight: 700; color: var(--you); display: flex; align-items: center; gap: 10px; letter-spacing: -.02em; }
        .hdr-chips { display:inline-flex; gap:6px; flex-wrap:wrap; }
        .hdr-chips span { font:650 10px/1.1 ui-monospace,Consolas,monospace; padding:4px 8px; border-radius:999px; border:1px solid var(--line); color:var(--mut); }
        .status { padding: 6px 16px; border-radius: 9999px; font-size: 13px; font-weight: 500; background: #64748b; }
        .main { flex: 1; display: flex; padding: 20px; gap: 20px; overflow: hidden; min-height: 0; }
        .panel { background: rgba(15,23,42,0.6); border-radius: 14px; padding: 20px; border: 1px solid #334155; backdrop-filter: blur(12px); width: 320px; flex-shrink: 0; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
        .panel-scroll { flex: 1; overflow-y: auto; min-height: 0; scrollbar-width: thin; scrollbar-color: #334155 transparent; }
        .panel-scroll::-webkit-scrollbar { width: 4px; }
        .panel-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        h2 { margin: 0 0 14px 0; color: #94a3b8; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; display: flex; align-items: center; gap: 6px; }
        h2.section-head { margin-top: 20px; padding-top: 16px; border-top: 1px solid #1e293b; }
        input, select { width: 100%; padding: 11px 14px; background: #1e2937; border: 1.5px solid #475569; border-radius: 10px; color: white; font-size: 14px; margin-bottom: 10px; outline: none; font-family: inherit; }
        input:focus, select:focus { border-color: #6366f1; }
        select option { background: #1e2937; }
        button { width: 100%; padding: 11px 14px; background: var(--primary); color: white; border: none; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-bottom: 10px; }
        button:hover { background: var(--primary-dark); }
        button.danger { background: #ef4444; }
        button.success { background: #22c55e; }
        button.info { background: #3b82f6; }
        button.muted { background: #475569; }
        .btn-row { display: flex; gap: 8px; }
        .btn-row button { flex: 1; }
        #remoteScreen { flex: 1; background: #000; border-radius: 14px; overflow: hidden; position: relative; border: 1px solid #334155; display: none; }
        #remoteScreen video { width: 100%; height: 100%; object-fit: contain; }
        .overlay { position: absolute; inset: 0; pointer-events: none; }
        .mon-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 8px; }
        .mon-head > span { font-size: 11px; color: var(--mut); font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; }
        .mon-refresh { width: auto; margin: 0; padding: 5px 10px; font-size: 11px; background: #475569; border-radius: 8px; }
        .mon-refresh:hover { background: #5b6b80; }
        .mon-refresh:disabled { opacity: .55; cursor: default; }
        .mon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(126px, 1fr)); gap: 8px; margin-bottom: 10px; }
        .mon-card { position: relative; width: 100%; margin: 0; padding: 0; background: #1e2937; border: 1.5px solid #475569; border-radius: 10px; overflow: hidden; cursor: pointer; text-align: left; transition: border-color .15s, transform .15s; }
        .mon-card:hover { background: #1e2937; border-color: #6366f1; transform: translateY(-1px); }
        .mon-card.sel { border-color: var(--you); box-shadow: 0 0 0 2px color-mix(in srgb, var(--you) 32%, transparent); }
        .mon-card img, .mon-card .mon-none { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
        .mon-card .mon-none { display: flex; align-items: center; justify-content: center; background: #0f141c; color: var(--mut); font-size: 10px; }
        .mon-meta { display: block; padding: 6px 8px; }
        .mon-name { display: block; font-size: 11px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .mon-sub { display: block; font: 400 10px/1.4 ui-monospace, Consolas, monospace; color: var(--mut); }
        .mon-badge { position: absolute; top: 5px; left: 5px; font: 700 10px/1 ui-monospace, Consolas, monospace; background: rgba(10,11,14,.82); color: var(--ink); border: 1px solid var(--line); padding: 3px 6px; border-radius: 6px; }
        .mon-flag { position: absolute; top: 5px; right: 5px; font: 700 9px/1 system-ui, sans-serif; background: var(--you); color: #0A0B0E; padding: 3px 6px; border-radius: 6px; letter-spacing: .4px; }
        .mon-empty { font-size: 12px; color: var(--mut); padding: 8px 0 12px; }
        .room-code { font-family: monospace; font-size: 26px; letter-spacing: 4px; background: #1e2937; padding: 12px 16px; border-radius: 10px; text-align: center; margin: 12px 0; color: #a5b4fc; border: 1.5px solid #334155; }
        .log-wrap { flex: 0 0 auto; height: 200px; display: flex; flex-direction: column; min-height: 0; }
        .log { font-size: 11px; background: #0a0f1a; padding: 10px 12px; border-radius: 8px; flex: 1; overflow-y: auto; font-family: monospace; line-height: 1.6; min-height: 0; scrollbar-width: thin; scrollbar-color: #334155 transparent; }
        .log::-webkit-scrollbar { width: 4px; }
        .log::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        .v-resizer { flex: 0 0 auto; height: 11px; margin: 2px -20px 4px; display: flex; align-items: center; justify-content: center; cursor: row-resize; touch-action: none; outline: none; }
        .v-resizer::before { content: ''; width: 44px; height: 3px; border-radius: 999px; background: #334155; transition: background .15s, width .15s; }
        .v-resizer:hover::before, .v-resizer.drag::before, .v-resizer:focus-visible::before { background: var(--you); width: 68px; }
        .setting-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; gap: 8px; }
        .setting-row label { font-size: 12px; color: #94a3b8; font-weight: 500; flex-shrink: 0; }
        .setting-row select, .setting-row input[type=range] { margin-bottom: 0; flex: 1; }
        .setting-row input[type=range] { padding: 0; border: none; background: transparent; accent-color: #6366f1; }
        .quality-val { font-size: 12px; color: #a5b4fc; min-width: 44px; text-align: right; }
        .toggle-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
        .toggle-row label { font-size: 12px; color: #94a3b8; font-weight: 500; }
        .toggle { position: relative; width: 38px; height: 22px; }
        .toggle input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; inset: 0; background: #334155; border-radius: 22px; cursor: pointer; transition: background 0.2s; }
        .slider:before { content: ''; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: white; border-radius: 50%; transition: transform 0.2s; }
        .toggle input:checked + .slider { background: #6366f1; }
        .toggle input:checked + .slider:before { transform: translateX(16px); }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-bottom: 10px; }
        .stat-box { background: #0a0f1a; border-radius: 8px; padding: 8px 10px; }
        .stat-box .stat-label { font-size: 10px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        .stat-box .stat-val { font-size: 14px; font-weight: 600; color: #e2e8f0; margin-top: 2px; }
        .segmented { display: flex; background: #0a0f1a; border-radius: 10px; padding: 3px; margin-bottom: 14px; gap: 3px; border: 1px solid #1e293b; }
        .seg-btn { flex: 1; padding: 9px 8px; background: transparent; color: #94a3b8; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; margin: 0; transition: background 0.15s, color 0.15s; }
        .seg-btn.active { background: #1e2937; color: white; box-shadow: 0 1px 2px rgba(0,0,0,0.35); }
        .seg-btn:hover:not(.active) { color: #cbd5e1; }
        .auto-hint { font-size: 10px; color: #6366f1; margin: -6px 0 8px 0; letter-spacing: 0.4px; text-transform: uppercase; font-weight: 600; display: none; }
        .auto-hint.on { display: block; }
        .signal-pill { display: inline-flex; align-items: center; gap: 5px; }
        .signal-dot { width: 8px; height: 8px; border-radius: 50%; background: #64748b; }
        .live-pill { display: inline-block; font-size: 10px; padding: 3px 8px; border-radius: 9999px; background: #22c55e; color: white; font-weight: 700; letter-spacing: 0.5px; margin-left: 6px; vertical-align: middle; animation: pulse 2s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
        h2.section-head .live-pill { animation: pulse 2s ease-in-out infinite; }
        input[disabled], select[disabled] { opacity: 0.55; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">Amni-Connect</div>
            <div class="hdr-chips" id="hdrChips"><span id="chipSig">sig —</span><span id="chipRtc">rtc —</span><span id="chipIn">input —</span></div>
            <div id="status" class="status">Disconnected</div>
        </header>
        <div class="main">
            <div class="panel">
                <div class="panel-scroll">
                    <h2>&#128640; Session Control</h2>
                    <div class="segmented" id="modeSwitch">
                        <button class="seg-btn active" data-mode="host" onclick="setMode('host')">&#128640; Host</button>
                        <button class="seg-btn" data-mode="join" onclick="setMode('join')">&#128279; Join</button>
                    </div>
                    <div id="hostMode">
                        <input type="text" id="customRoomCode" placeholder="Optional: Persistent Room Code" style="text-transform:uppercase">
                        <select id="monitorSelect" style="display:none"></select>
                        <div class="mon-head"><span>Screen to share</span><button type="button" class="mon-refresh" id="monRefresh" onclick="loadSources(true)">&#8635; Refresh</button></div>
                        <div class="mon-grid" id="monitorGrid"></div>
                        <button onclick="createAndHost()">&#128640; Start Hosting (Share Screen)</button>
                    </div>
                    <div id="viewerMode" style="display:none;">
                        <input type="text" id="roomCodeInput" placeholder="Enter Room Code" maxlength="32" style="text-transform:uppercase">
                        <button onclick="joinSession()">&#128279; Join Remote Session</button>
                    </div>
                    <div id="activeSession" style="display:none;">
                        <div class="room-code" id="displayCode">———</div>
                        <img id="pairQr" alt="Scan to join" style="display:none;width:160px;height:160px;background:#fff;border-radius:8px;padding:6px;margin:8px auto;object-fit:contain">
                        <div class="btn-row">
                            <button class="success" onclick="copyCode()">&#128203; Code</button>
                            <button class="info" onclick="copyLink()">&#128279; Link</button>
                        </div>
                        <button class="danger" onclick="endSession()">&#9940; End Session</button>
                    </div>

                    <h2 class="section-head">&#9881;&#65039; Stream Settings <span id="liveSettingsPill" class="live-pill" style="display:none;">LIVE</span></h2>
                    <div class="setting-row">
                        <label>Resolution</label>
                        <select id="resolutionSelect" onchange="applyStreamSettings()">
                            <option value="source">Source (native)</option>
                            <option value="1920x1080" selected>1080p — 1920×1080</option>
                            <option value="1280x720">720p — 1280×720</option>
                            <option value="2560x1440">1440p — 2560×1440</option>
                            <option value="3840x2160">4K — 3840×2160</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>Frame Rate</label>
                        <select id="fpsSelect" onchange="applyStreamSettings()">
                            <option value="60">60 fps</option>
                            <option value="30" selected>30 fps</option>
                            <option value="24">24 fps</option>
                            <option value="15">15 fps</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>Bitrate</label>
                        <input type="range" id="qualitySlider" min="500" max="20000" step="500" value="4000" oninput="onSliderInput()">
                        <span class="quality-val" id="qualityLabel">4 Mbps</span>
                    </div>
                    <div id="autoHint" class="auto-hint">&#128640; Auto-adapting to network</div>
                    <div class="toggle-row">
                        <label>Auto Bitrate <span style="font-size:10px;color:#64748b;font-weight:400;">(adapts to signal)</span></label>
                        <label class="toggle"><input type="checkbox" id="autoBitrateToggle" checked onchange="toggleAutoBitrate()"><span class="slider"></span></label>
                    </div>
                    <div class="toggle-row">
                        <label>Audio</label>
                        <label class="toggle"><input type="checkbox" id="audioToggle" checked onchange="applyStreamSettings()"><span class="slider"></span></label>
                    </div>
                    <div class="toggle-row">
                        <label>Lock Viewer Input</label>
                        <label class="toggle"><input type="checkbox" id="lockInputToggle" onchange="toggleInputLock()"><span class="slider"></span></label>
                    </div>
                    <div class="toggle-row">
                        <label>View Only (this side)</label>
                        <label class="toggle"><input type="checkbox" id="viewOnlyToggle"><span class="slider"></span></label>
                    </div>

                    <h2 class="section-head">&#128202; Connection Stats</h2>
                    <div class="stat-grid">
                        <div class="stat-box"><div class="stat-label">Bitrate</div><div class="stat-val" id="statBitrate">—</div></div>
                        <div class="stat-box"><div class="stat-label">FPS</div><div class="stat-val" id="statFps">—</div></div>
                        <div class="stat-box"><div class="stat-label">Latency</div><div class="stat-val" id="statLatency">—</div></div>
                        <div class="stat-box"><div class="stat-label">Loss</div><div class="stat-val" id="statLoss">—</div></div>
                        <div class="stat-box"><div class="stat-label">Resolution</div><div class="stat-val" id="statRes">—</div></div>
                        <div class="stat-box"><div class="stat-label">Signal</div><div class="stat-val signal-pill" id="statSignal"><span class="signal-dot" id="signalDot"></span><span id="signalText">—</span></div></div>
                    </div>
                </div>

                <div class="v-resizer" id="panelResizer" role="separator" aria-orientation="horizontal" tabindex="0" title="Drag to resize. Double-click to reset."></div>

                <div class="log-wrap">
                    <h2 style="margin-top:4px;margin-bottom:8px;">&#128196; Connection Log</h2>
                    <div id="log" class="log"></div>
                </div>
            </div>
            <div id="remoteScreen">
                <video id="remoteVideo" autoplay playsinline></video>
                <div class="overlay" id="inputOverlay" style="pointer-events:auto"></div>
            </div>
        </div>
    </div>

    <script src="node_modules/socket.io-client/dist/socket.io.min.js"></script>
    <script>
        const SIGNALING_URL = 'http://localhost:3389';
        const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }];
        let socket, pc, localStream, roomId, isHost = false, inputLocked = false;
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const remoteScreen = document.getElementById('remoteScreen');
        const remoteVideo = document.getElementById('remoteVideo');

        function log(msg, type = 'info') {
            const color = type === 'success' ? '#86efac' : type === 'error' ? '#fda4af' : '#e0f2fe';
            logEl.innerHTML += `<span style="color:${color}">[${new Date().toLocaleTimeString()}] ${msg}</span><br>`;
            logEl.scrollTop = logEl.scrollHeight;
        }

        function setStatus(text, color = '#64748b') {
            statusEl.textContent = text;
            statusEl.style.background = color;
        }

        function updateQualityLabel() {
            const v = parseInt(document.getElementById('qualitySlider').value);
            document.getElementById('qualityLabel').textContent = v >= 1000 ? (v / 1000).toFixed(v % 1000 ? 1 : 0) + ' Mbps' : v + ' Kbps';
        }
        updateQualityLabel();

        const AB = { enabled: true, lastLoss: 0, lastRtt: 0, lastAvail: 0, lastQlim: 'none', priorPacketsLost: 0, priorPacketsRcvd: 0 };
        function onSliderInput() {
            updateQualityLabel();
            if (document.getElementById('autoBitrateToggle').checked) { document.getElementById('autoBitrateToggle').checked = false; toggleAutoBitrate(); }
            applyBitrate();
        }
        function toggleAutoBitrate() {
            AB.enabled = document.getElementById('autoBitrateToggle').checked;
            document.getElementById('autoHint').classList.toggle('on', AB.enabled);
            log(AB.enabled ? 'Auto-bitrate enabled — adapting to network' : 'Auto-bitrate off — manual slider authoritative');
        }
        function setMode(mode) {
            document.querySelectorAll('#modeSwitch .seg-btn').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
            document.getElementById('hostMode').style.display = mode === 'host' ? 'block' : 'none';
            document.getElementById('viewerMode').style.display = mode === 'join' ? 'block' : 'none';
        }
        function setLiveSettings(on) {
            document.getElementById('liveSettingsPill').style.display = on ? 'inline-block' : 'none';
        }
        function signalLabel(loss, rtt) {
            const r = rtt || 0, l = loss || 0;
            if (r > 0.3 || l > 0.07) return { name: 'Poor', color: '#ef4444' };
            if (r > 0.15 || l > 0.03) return { name: 'Fair', color: '#f59e0b' };
            if (r > 0.07 || l > 0.01) return { name: 'Good', color: '#22c55e' };
            return r > 0 ? { name: 'Excellent', color: '#86efac' } : { name: '—', color: '#64748b' };
        }
        function autoTick() {
            if (!pc || !AB.enabled || !isHost) return;
            const slider = document.getElementById('qualitySlider');
            const cur = parseInt(slider.value);
            const lossBad = AB.lastLoss > 0.05, lossOk = AB.lastLoss < 0.01;
            const rttBad = AB.lastRtt > 0.25, rttOk = AB.lastRtt > 0 && AB.lastRtt < 0.06;
            const cpuLim = AB.lastQlim === 'cpu', bwLim = AB.lastQlim === 'bandwidth';
            let next = cur;
            if (lossBad || rttBad || bwLim) next = Math.max(500, Math.round(cur * 0.82));
            else if (lossOk && rttOk && !cpuLim) next = Math.min(20000, cur + 500);
            if (AB.lastAvail > 0) next = Math.min(next, Math.max(500, Math.round(AB.lastAvail / 1000 * 0.92)));
            next = Math.round(next / 500) * 500;
            if (Math.abs(next - cur) >= 500) { slider.value = next; updateQualityLabel(); applyBitrate(); }
        }

        function getResolution() {
            const v = document.getElementById('resolutionSelect').value;
            if (v === 'source') return null;
            const [w, h] = v.split('x').map(Number);
            return { width: w, height: h };
        }

        async function applyStreamSettings() {
            if (!localStream) return;
            const res = getResolution();
            const fps = parseInt(document.getElementById('fpsSelect').value);
            const audioOn = document.getElementById('audioToggle').checked;
            const constraints = { frameRate: { ideal: fps } };
            if (res) { constraints.width = { ideal: res.width }; constraints.height = { ideal: res.height }; }
            const vt = localStream.getVideoTracks()[0];
            if (vt) { try { await vt.applyConstraints(constraints); log(`Stream: ${res ? res.width + '×' + res.height : 'native'} @ ${fps}fps`); } catch(e) { log('Constraint apply failed: ' + e.message, 'error'); } }
            localStream.getAudioTracks().forEach(t => { t.enabled = audioOn; });
            applyBitrate();
        }

        function applyBitrate() {
            if (!pc) return;
            const kbps = parseInt(document.getElementById('qualitySlider').value);
            pc.getSenders().forEach(async sender => {
                if (sender.track?.kind !== 'video') return;
                const params = sender.getParameters();
                if (!params.encodings?.length) params.encodings = [{}];
                params.encodings[0].maxBitrate = kbps * 1000;
                try { await sender.setParameters(params); } catch(e) {}
            });
        }

        function toggleInputLock() {
            inputLocked = document.getElementById('lockInputToggle').checked;
            log(inputLocked ? 'Viewer input locked' : 'Viewer input unlocked');
        }

        function initSocket() {
            socket = io(SIGNALING_URL, { transports: ['websocket','polling'] });
            socket.on('connect', () => {
                log('Signaling server connected', 'success');
                paintHostChips();
                if (isHost && roomId) { socket.emit('create-room', roomId); log(`Reclaimed room ${roomId} after reconnect`, 'success'); }
            });
            socket.on('connect_error', () => log('Cannot reach signaling server — is it running?', 'error'));
            socket.on('offer', async ({ offer }) => {
                if (!pc) createPC();
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                const answer = await pc.createAnswer();
                await pc.setLocalDescription(answer);
                socket.emit('answer', { roomId, answer });
                log('WebRTC answer sent');
            });
            socket.on('answer', async ({ answer }) => {
                await pc?.setRemoteDescription(new RTCSessionDescription(answer));
                log('WebRTC answer received', 'success');
            });
            socket.on('ice-candidate', ({ candidate }) => pc?.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {}));
            socket.on('host-disconnected', () => { log('Host disconnected', 'error'); setStatus('Disconnected', '#ef4444'); });
        }

        let dataChannel, hostIceTries = 0, hostRecoverBusy = false;
        function paintHostChips() {
            const sig = document.getElementById('chipSig');
            const rtc = document.getElementById('chipRtc');
            const inn = document.getElementById('chipIn');
            if (sig) sig.textContent = socket && socket.connected ? 'sig up' : 'sig down';
            const st = pc ? pc.connectionState : 'idle';
            if (rtc) rtc.textContent = 'rtc ' + st;
            const inOpen = dataChannel && dataChannel.readyState === 'open';
            if (inn) inn.textContent = inOpen ? 'input p2p' : (socket && socket.connected ? 'input relay' : 'input none');
        }
        async function recoverHostPc() {
            if (hostRecoverBusy || !pc) return;
            hostRecoverBusy = true;
            try {
                if (hostIceTries < 3) {
                    hostIceTries++;
                    log('ICE restart ' + hostIceTries);
                    const offer = await pc.createOffer({ iceRestart: true });
                    await pc.setLocalDescription(offer);
                    socket.emit('offer', { roomId, offer });
                }
            } catch (e) { log('ICE restart failed: ' + e.message, 'error'); }
            finally { hostRecoverBusy = false; paintHostChips(); }
        }
        function createPC() {
            pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
            pc.onicecandidate = ({ candidate }) => candidate && socket.emit('ice-candidate', { roomId, candidate });
            pc.onconnectionstatechange = () => {
                log(`WebRTC: ${pc.connectionState}`);
                paintHostChips();
                if (pc.connectionState === 'connected') startStatsLoop();
                else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') recoverHostPc();
            };
            pc.ontrack = ({ streams }) => {
                remoteVideo.srcObject = streams[0];
                remoteScreen.style.display = 'flex';
                log('Remote desktop stream connected', 'success');
                setStatus('Viewing \u2022 E2EE', '#22c55e');
            };
            isHost ? (dataChannel = pc.createDataChannel('clipboard'), setupDataChannel(dataChannel)) : (pc.ondatachannel = (e) => { dataChannel = e.channel; setupDataChannel(dataChannel); });
            if (isHost && localStream) localStream.getTracks().forEach(t => pc.addTrack(t, localStream));
        }

        function setupDataChannel(channel) {
            channel.onopen = () => { log('E2EE Data channel opened'); applyBitrate(); paintHostChips(); hostIceTries = 0; };
            channel.onmessage = async (e) => {
                if (typeof e.data !== 'string') return;
                const data = JSON.parse(e.data);
                if (data.type === 'input') {
                    if (isHost && !inputLocked && !document.getElementById('viewOnlyToggle').checked) window.electronAPI.sendInputEvent(data.ev);
                    return;
                }
                if (data.type === 'clipboard-sync') {
                    isHost ? (window.electronAPI.writeClipboard(data.text), log('Host clipboard updated from viewer')) : console.log('Clipboard from host:', data.text);
                }
            };
        }

        let lastClipboard = '';
        setInterval(async () => {
            if (isHost && dataChannel?.readyState === 'open') {
                const text = await window.electronAPI.readClipboard();
                if (text && text !== lastClipboard) { lastClipboard = text; dataChannel.send(JSON.stringify({ type: 'clipboard-sync', text })); }
            }
        }, 2000);

        let statsLoop = null;
        let lastBytes = 0, lastTs = 0;
        function startStatsLoop() {
            if (statsLoop) clearInterval(statsLoop);
            statsLoop = setInterval(async () => {
                if (!pc) return;
                const stats = await pc.getStats();
                let rtt = 0, loss = 0, avail = 0, qlim = 'none', haveRtt = false, haveLoss = false;
                stats.forEach(r => {
                    if (r.type === 'inbound-rtp' && r.kind === 'video') {
                        const now = Date.now();
                        const bps = lastTs ? (r.bytesReceived - lastBytes) / ((now - lastTs) / 1000) * 8 : 0;
                        lastBytes = r.bytesReceived; lastTs = now;
                        document.getElementById('statBitrate').textContent = bps > 1e6 ? (bps/1e6).toFixed(1)+' Mbps' : Math.round(bps/1000)+' Kbps';
                        document.getElementById('statFps').textContent = (r.framesPerSecond || 0).toFixed(0);
                        if (r.frameWidth) document.getElementById('statRes').textContent = r.frameWidth+'×'+r.frameHeight;
                        const rcvd = r.packetsReceived || 0, lost = r.packetsLost || 0;
                        const dRcvd = rcvd - AB.priorPacketsRcvd, dLost = lost - AB.priorPacketsLost;
                        AB.priorPacketsRcvd = rcvd; AB.priorPacketsLost = lost;
                        if (dRcvd + dLost > 0) { loss = Math.max(0, dLost / (dRcvd + dLost)); haveLoss = true; }
                    }
                    if (r.type === 'candidate-pair' && (r.state === 'succeeded' || r.nominated)) {
                        if (r.currentRoundTripTime != null) {
                            rtt = r.currentRoundTripTime; haveRtt = true;
                            document.getElementById('statLatency').textContent = Math.round(rtt*1000)+'ms';
                        }
                        if (r.availableOutgoingBitrate) avail = r.availableOutgoingBitrate;
                    }
                    if (r.type === 'remote-inbound-rtp' && r.kind === 'video') {
                        if (r.fractionLost != null) { loss = r.fractionLost; haveLoss = true; }
                        if (r.roundTripTime != null && !haveRtt) { rtt = r.roundTripTime; haveRtt = true; document.getElementById('statLatency').textContent = Math.round(rtt*1000)+'ms'; }
                    }
                    if (r.type === 'outbound-rtp' && r.kind === 'video') {
                        const now = Date.now();
                        const bps = lastTs ? (r.bytesSent - lastBytes) / ((now - lastTs) / 1000) * 8 : 0;
                        lastBytes = r.bytesSent; lastTs = now;
                        document.getElementById('statBitrate').textContent = bps > 1e6 ? (bps/1e6).toFixed(1)+' Mbps' : Math.round(bps/1000)+' Kbps';
                        document.getElementById('statFps').textContent = (r.framesPerSecond || 0).toFixed(0);
                        if (r.frameWidth) document.getElementById('statRes').textContent = r.frameWidth+'×'+r.frameHeight;
                        if (r.qualityLimitationReason) qlim = r.qualityLimitationReason;
                    }
                });
                if (haveRtt) AB.lastRtt = rtt;
                if (haveLoss) AB.lastLoss = loss;
                if (avail) AB.lastAvail = avail;
                AB.lastQlim = qlim;
                document.getElementById('statLoss').textContent = haveLoss ? (loss * 100).toFixed(1) + '%' : '—';
                const sig = signalLabel(AB.lastLoss, AB.lastRtt);
                document.getElementById('signalText').textContent = sig.name;
                document.getElementById('signalDot').style.background = sig.color;
                paintHostChips();
                autoTick();
            }, 500);
        }

        const MON_REFRESH_MS = 3000;
        let availableSources = [];
        let selectedSourceId = null;
        let sourcesLoadedOnce = false;

        function escHtml(s) {
            return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // The hidden <select> stays the single source of truth for createAndHost(),
        // so the picker below is purely a nicer way to set it.
        function selectSource(id) {
            selectedSourceId = id;
            document.getElementById('monitorSelect').value = id;
            document.querySelectorAll('#monitorGrid .mon-card').forEach(c => c.classList.toggle('sel', c.dataset.id === id));
        }

        function renderMonitorGrid() {
            const grid = document.getElementById('monitorGrid');
            if (!availableSources.length) {
                grid.innerHTML = '<div class="mon-empty">No screens detected. Click Refresh.</div>';
                return;
            }
            if (!availableSources.some(s => s.id === selectedSourceId)) selectedSourceId = availableSources[0].id;
            grid.innerHTML = availableSources.map(s => {
                const dims = s.width && s.height ? s.width + '\u00d7' + s.height : '';
                const shot = s.thumbnail ? '<img alt="" src="' + s.thumbnail + '">' : '<div class="mon-none">no preview</div>';
                return '<button type="button" class="mon-card' + (s.id === selectedSourceId ? ' sel' : '') + '"'
                    + ' data-id="' + escHtml(s.id) + '" title="' + escHtml(s.name) + '">'
                    + shot
                    + '<span class="mon-badge">' + s.index + '</span>'
                    + (s.primary ? '<span class="mon-flag">MAIN</span>' : '')
                    + '<span class="mon-meta"><span class="mon-name">' + escHtml(s.name) + '</span>'
                    + '<span class="mon-sub">' + dims + '</span></span>'
                    + '</button>';
            }).join('');
            grid.querySelectorAll('.mon-card').forEach(c => c.addEventListener('click', () => selectSource(c.dataset.id)));
            document.getElementById('monitorSelect').value = selectedSourceId;
        }

        // Swap thumbnail pixels in place when the screen list itself has not changed.
        // Rebuilding innerHTML every tick would make the previews flicker and drop the selection ring.
        function refreshThumbs() {
            document.querySelectorAll('#monitorGrid .mon-card').forEach(card => {
                const s = availableSources.find(x => x.id === card.dataset.id);
                const img = card.querySelector('img');
                if (s && s.thumbnail && img) img.src = s.thumbnail;
            });
        }

        function sameScreenSet(a, b) {
            return a.length === b.length && a.every((s, i) => s.id === b[i].id && s.name === b[i].name);
        }

        async function loadSources(manual) {
            const btn = document.getElementById('monRefresh');
            if (manual && btn) { btn.disabled = true; btn.textContent = '\u2026'; }
            try {
                const sources = await window.electronAPI.getSources();
                const prev = availableSources;
                availableSources = sources;
                if (sameScreenSet(prev, sources) && document.querySelector('#monitorGrid .mon-card')) {
                    refreshThumbs();
                } else {
                    const select = document.getElementById('monitorSelect');
                    select.innerHTML = '';
                    sources.forEach(s => { const o = document.createElement('option'); o.value = s.id; o.textContent = s.name; select.appendChild(o); });
                    renderMonitorGrid();
                    if (manual) log('Found ' + sources.length + ' screen' + (sources.length === 1 ? '' : 's'), 'success');
                }
                if (!sourcesLoadedOnce) {
                    sourcesLoadedOnce = true;
                    const autoCode = document.getElementById('customRoomCode').value.trim();
                    if (autoCode && sources.length && !isHost) { setMode('host'); createAndHost(); }
                }
            } catch (e) {
                log('Could not list screens: ' + (e && e.message ? e.message : e), 'error');
            } finally {
                if (manual && btn) { btn.disabled = false; btn.innerHTML = '&#8635; Refresh'; }
            }
        }

        loadSources(false);
        // Tick only while the picker is actually on screen and idle. Once hosting starts the host
        // panel is hidden, so this stops paying for captures nobody is looking at.
        setInterval(() => {
            if (document.hidden || isHost || !document.hasFocus()) return;
            if (document.getElementById('hostMode').style.display === 'none') return;
            loadSources(false);
        }, MON_REFRESH_MS);

        async function createAndHost() {
            initSocket();
            const customCode = document.getElementById('customRoomCode').value.trim().toUpperCase();
            if (customCode) localStorage.setItem('amni-custom-code', customCode);
            const sourceId = document.getElementById('monitorSelect').value;
            const src = availableSources.find(s => s.id === sourceId) || availableSources[0];
            const res = getResolution();
            const fps = parseInt(document.getElementById('fpsSelect').value);
            const audioOn = document.getElementById('audioToggle').checked;
            const videoConstraints = { chromeMediaSource: 'desktop', chromeMediaSourceId: src.id, frameRate: { ideal: fps } };
            if (res) { videoConstraints.maxWidth = res.width; videoConstraints.maxHeight = res.height; }
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: audioOn ? { mandatory: { chromeMediaSource: 'desktop' } } : false, video: { mandatory: videoConstraints } });
            } catch (err) {
                log('Falling back to video-only capture', 'error');
                localStream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { mandatory: videoConstraints } });
            }
            localStream.getTracks().forEach(t => t.onended = () => endSession(true));
            isHost = true;
            socket.emit('create-room', customCode);
            socket.once('room-created', async (id) => {
                roomId = id;
                document.getElementById('activeSession').style.display = 'block';
                document.getElementById('hostMode').style.display = 'none';
                document.getElementById('viewerMode').style.display = 'none';
                document.getElementById('modeSwitch').style.display = 'none';
                document.getElementById('displayCode').textContent = roomId;
                paintPairQr();
                setStatus('Hosting \u2022 E2EE', '#22c55e');
                setLiveSettings(true);
                log(`Room ${roomId} created — sharing: ${src.name}`, 'success');
                socket.on('viewer-joined', async () => {
                    log('Viewer joined — sending offer');
                    createPC();
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    socket.emit('offer', { roomId, offer });
                });
                socket.on('input-event', (data) => {
                    if (!inputLocked && !document.getElementById('viewOnlyToggle').checked) window.electronAPI.sendInputEvent(data);
                });
                socket.on('file-received', (data) => {
                    log(`Received file: ${data.name} (${(data.size / 1024).toFixed(1)} KB)`, 'success');
                });
            });
        }

        async function joinSession() {
            const code = document.getElementById('roomCodeInput').value.trim().toUpperCase();
            if (code.length < 4) return log('Room code must be at least 4 characters', 'error');
            initSocket();
            isHost = false;
            socket.emit('join-room', code);
            socket.once('room-joined', (id) => {
                roomId = id;
                document.getElementById('activeSession').style.display = 'block';
                document.getElementById('hostMode').style.display = 'none';
                document.getElementById('viewerMode').style.display = 'none';
                document.getElementById('displayCode').textContent = roomId;
                document.getElementById('modeSwitch').style.display = 'none';
                ['resolutionSelect','fpsSelect','audioToggle','autoBitrateToggle','qualitySlider'].forEach(i => { const el = document.getElementById(i); if (el) el.disabled = true; });
                document.getElementById('autoHint').classList.remove('on');
                setStatus('Connected \u2022 E2EE', '#22c55e');
                log('Joined — waiting for stream...', 'success');
                createPC();
            });
            socket.once('error', (msg) => log(msg, 'error'));
        }

        function copyCode() { navigator.clipboard.writeText(roomId); log('Room code copied'); }

        async function pairUrl() {
            const ip = await window.electronAPI.getLocalIp();
            return `http://${ip}:3389/viewer?host=${ip}&code=${roomId}`;
        }
        async function paintPairQr() {
            const img = document.getElementById('pairQr');
            if (!img || !roomId) return;
            try {
                const url = await pairUrl();
                img.src = 'http://127.0.0.1:3389/qr?url=' + encodeURIComponent(url);
                img.style.display = 'block';
            } catch (e) { img.style.display = 'none'; }
        }
        async function copyLink() {
            const url = await pairUrl();
            navigator.clipboard.writeText(url);
            paintPairQr();
            log(`Mobile link copied: ${url}`, 'success');
        }

        function endSession() {
            if (confirm('End this session?')) { statsLoop && clearInterval(statsLoop); location.reload(); }
        }

        const overlay = document.getElementById('inputOverlay');
        const joinCtl = () => !isHost && roomId && !document.getElementById('viewOnlyToggle').checked;
        const sendIn = (ev) => {
            if (dataChannel && dataChannel.readyState === 'open') { try { dataChannel.send(JSON.stringify({ type: 'input', ev })); return; } catch (e) {} }
            if (socket && socket.connected && roomId) { socket.emit('input-event', { ...ev, roomId }); return; }
        };
        function joinCoord(e) {
            const v = document.getElementById('remoteVideo'), r = overlay.getBoundingClientRect(), vw = v.videoWidth, vh = v.videoHeight;
            if (!vw || !vh) return { x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height };
            const cAR = r.width / r.height, vAR = vw / vh, dW = vAR > cAR ? r.width : r.height * vAR, dH = vAR > cAR ? r.width / vAR : r.height, left = r.left + (r.width - dW) / 2, top = r.top + (r.height - dH) / 2;
            return { x: Math.max(0, Math.min(1, (e.clientX - left) / dW)), y: Math.max(0, Math.min(1, (e.clientY - top) / dH)) };
        }
        let joinHeld = false;
        overlay.addEventListener('mousemove', (e) => { if (!joinCtl()) return; const sc = joinCoord(e); sendIn({ type: 'mouse-move', x: sc.x, y: sc.y }); });
        overlay.addEventListener('mousedown', (e) => {
            if (!joinCtl()) return;
            e.preventDefault();
            const sc = joinCoord(e); sendIn({ type: 'mouse-move', x: sc.x, y: sc.y });
            e.button === 2 ? sendIn({ type: 'mouse-right-click' }) : e.button === 1 ? sendIn({ type: 'mouse-middle-click' }) : (joinHeld = true, sendIn({ type: 'mouse-down' }));
        });
        const joinEndMouse = () => { if (joinHeld) { joinHeld = false; sendIn({ type: 'mouse-up' }); } };
        overlay.addEventListener('mouseup', (e) => { if (!joinCtl()) return; e.preventDefault(); (e.button === 0) && joinEndMouse(); });
        overlay.addEventListener('mouseleave', joinEndMouse);
        overlay.addEventListener('contextmenu', (e) => e.preventDefault());
        overlay.addEventListener('wheel', (e) => {
            if (!joinCtl()) return;
            e.preventDefault();
            const sx = e.deltaX ? (e.deltaX > 0 ? 1 : -1) : 0, sy = e.deltaY ? (e.deltaY > 0 ? 1 : -1) : 0;
            (sx || sy) && sendIn({ type: 'mouse-scroll', dx: sx, dy: sy });
        }, { passive: false });
        const joinEditable = () => ['INPUT', 'TEXTAREA', 'SELECT'].includes((document.activeElement || {}).tagName);
        const JOIN_PASS = ['F5', 'F11', 'F12'];
        const joinHeldKeys = new Set();
        document.addEventListener('keydown', (e) => { if (!joinCtl() || joinEditable() || JOIN_PASS.includes(e.key)) return; e.preventDefault(); joinHeldKeys.add(e.key); sendIn({ type: 'key-down', key: e.key }); });
        document.addEventListener('keyup', (e) => { if (JOIN_PASS.includes(e.key)) return; joinHeldKeys.delete(e.key); if (!joinCtl()) return; e.preventDefault(); sendIn({ type: 'key-up', key: e.key }); });
        window.addEventListener('blur', () => { if (!joinCtl()) return; joinHeldKeys.forEach(k => sendIn({ type: 'key-up', key: k })); joinHeldKeys.clear(); joinEndMouse(); });

        window.electronAPI?.onStatusUpdate?.(msg => log(msg));
        document.getElementById('autoHint').classList.toggle('on', document.getElementById('autoBitrateToggle').checked);
        log('Amni-Connect initialized — End-to-End Encrypted', 'success');

        // Panel splitter. The settings list and the log both carried flex:1, so they hard-split
        // the panel 50/50 and the log ate half the height while you were still setting up.
        // The log now owns an explicit height and this handle is what sets it.
        (function panelSplitter() {
            const panel = document.querySelector('.panel');
            const logWrap = document.querySelector('.log-wrap');
            const bar = document.getElementById('panelResizer');
            if (!panel || !logWrap || !bar) return;
            const KEY = 'amni-log-h', DEFAULT_H = 200, MIN_LOG = 52, MIN_SETTINGS = 140;
            let padBottom = 0;

            // clientHeight still includes the panel's own padding, and the handle carries
            // vertical margins outside its offsetHeight. Miss either and the settings pane
            // collapses past MIN_SETTINGS when you drag the handle to the top.
            function px(v) { return parseFloat(v) || 0; }
            function contentH() {
                const cs = getComputedStyle(panel);
                return panel.clientHeight - px(cs.paddingTop) - px(cs.paddingBottom);
            }
            function barOuterH() {
                const cs = getComputedStyle(bar);
                return bar.offsetHeight + px(cs.marginTop) + px(cs.marginBottom);
            }
            function clamp(h) {
                const ch = contentH();
                if (ch <= 0) return Math.round(Math.max(MIN_LOG, h));
                const room = ch - MIN_SETTINGS - barOuterH();
                return Math.round(Math.max(MIN_LOG, Math.min(h, Math.max(MIN_LOG, room))));
            }
            function currentH() {
                return parseInt(logWrap.style.height, 10) || logWrap.offsetHeight || DEFAULT_H;
            }
            function setH(h, persist) {
                const v = clamp(h);
                logWrap.style.height = v + 'px';
                bar.setAttribute('aria-valuenow', String(v));
                if (persist) localStorage.setItem(KEY, String(v));
                return v;
            }

            const saved = parseInt(localStorage.getItem(KEY), 10);
            setH(Number.isFinite(saved) ? saved : DEFAULT_H, false);

            let dragging = false;
            bar.addEventListener('pointerdown', e => {
                dragging = true;
                padBottom = parseFloat(getComputedStyle(panel).paddingBottom) || 0;
                bar.classList.add('drag');
                document.body.style.userSelect = 'none';
                try { bar.setPointerCapture(e.pointerId); } catch (_) {}
                e.preventDefault();
            });
            bar.addEventListener('pointermove', e => {
                if (!dragging) return;
                setH(panel.getBoundingClientRect().bottom - padBottom - e.clientY, false);
            });
            function endDrag(e) {
                if (!dragging) return;
                dragging = false;
                bar.classList.remove('drag');
                document.body.style.userSelect = '';
                try { bar.releasePointerCapture(e.pointerId); } catch (_) {}
                localStorage.setItem(KEY, String(currentH()));
            }
            bar.addEventListener('pointerup', endDrag);
            bar.addEventListener('pointercancel', endDrag);
            bar.addEventListener('dblclick', () => setH(DEFAULT_H, true));
            bar.addEventListener('keydown', e => {
                const step = e.shiftKey ? 48 : 16;
                if (e.key === 'ArrowUp') setH(currentH() + step, true);
                else if (e.key === 'ArrowDown') setH(currentH() - step, true);
                else return;
                e.preventDefault();
                e.stopPropagation();
            });
            // A shorter window must not leave the log taller than the panel it lives in.
            window.addEventListener('resize', () => setH(currentH(), false));
        })();
    </script>
</body>
</html>
