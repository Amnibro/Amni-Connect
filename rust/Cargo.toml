[package]
name = "amni-control"
version = "0.1.0"
edition = "2021"
license-file = "../LICENSE"
description = "Rust input daemon for Amni-Connect (E2EE remote desktop)"
repository = "https://github.com/amnibro/Amni-Connect"
authors = ["Amnibro (Amni-Scient) <the maintainer (via GitHub)>"]

[dependencies]
enigo = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.56", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[[bin]]
name = "amni-control"
path = "src/main.rs"
